apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedrock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sassendes/bedrock.git
    targetRevision: main
    path: pipeline/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

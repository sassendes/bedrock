apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedrock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sassendes/bedrock.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      exclude: '{bootstrap/*,scripts/*}'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: "*"
      kind: Pod
      jsonPointers:
        - /spec/securityContext
        - /spec/containers
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/securityContext
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/securityContext
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/spec/securityContext

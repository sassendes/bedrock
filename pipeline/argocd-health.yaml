data:
  resource.customizations.health.ceph.rook.io_CephCluster: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "waiting for ceph status"
    if obj.status ~= nil and obj.status.ceph ~= nil and obj.status.ceph.health ~= nil then
      local h = obj.status.ceph.health
      hs.message = "ceph " .. h
      if h == "HEALTH_OK" or h == "HEALTH_WARN" then
        hs.status = "Healthy"
      elseif h == "HEALTH_ERR" then
        hs.status = "Degraded"
      end
    end
    if obj.status ~= nil and obj.status.phase == "Failure" then
      hs.status = "Degraded"
    end
    return hs
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  resource.customizations.health.postgresql.cnpg.io_Backup: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "backup running"
    if obj.status ~= nil and obj.status.phase ~= nil then
      if obj.status.phase == "completed" then
        hs.status = "Healthy"
        hs.message = "backup completed"
      elseif obj.status.phase == "failed" then
        hs.status = "Degraded"
        hs.message = obj.status.error or "backup failed"
      end
    end
    return hs

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedrock-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/sassendes/bedrock.git
    targetRevision: main
    path: observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/securityContext
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/securityContext
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/template/spec/securityContext

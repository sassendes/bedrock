apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedrock-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/sassendes/bedrock.git
    targetRevision: main
    path: .
    directory:
      recurse: false
      include: 'namespace.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - RespectIgnoreDifferences=true

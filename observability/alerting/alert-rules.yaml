apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bedrock-alerts
  namespace: application
  labels:
    release: prometheus
spec:
  groups:
    - name: node.rules
      rules:
        - alert: NodeHighCPU
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "CPU above 85% for 10 minutes ({{ $value | humanize }}%)."
        - alert: NodeHighMemory
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory on {{ $labels.instance }}"
            description: "Memory usage above 90% for 10 minutes ({{ $value | humanize }}%)."
        - alert: NodeMemoryCritical
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL memory on {{ $labels.instance }}"
            description: "Memory above 95% for 5 minutes, OOM risk ({{ $value | humanize }}%)."
        - alert: NodeDiskSpaceLow
          expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Disk filling on {{ $labels.instance }}"
            description: "Filesystem {{ $labels.mountpoint }} above 85% ({{ $value | humanize }}%)."
        - alert: NodeDiskSpaceCritical
          expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 92
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL disk on {{ $labels.instance }}"
            description: "Filesystem {{ $labels.mountpoint }} above 92%, act now ({{ $value | humanize }}%)."
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Node exporter down: {{ $labels.instance }}"
            description: "Cannot scrape node {{ $labels.instance }} for 3 minutes, node may be down."
    - name: kubernetes.rules
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod crashlooping: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Restarted more than 3 times in 15 minutes."
        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
            or
            sum by (namespace, pod) ((kube_pod_status_ready{condition="false"} == 1) unless on (namespace, pod) (kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1)) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod stuck: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Pod pending, unknown, or running without passing readiness for 15 minutes."
        - alert: ContainerNearMemoryLimit
          expr: (container_memory_working_set_bytes{container!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{resource="memory"}) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container near memory limit: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "{{ $labels.container }} using {{ $value | humanize }}% of its memory limit, OOMKill risk."
        - alert: PVCAlmostFull
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC filling: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
            description: "PersistentVolumeClaim above 85% ({{ $value | humanize }}%)."
        - alert: PVCCritical
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 92
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL PVC: {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}"
            description: "PVC above 92%, postgres write failure risk ({{ $value | humanize }}%)."
        - alert: PodFailed
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Failed"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "pod failed: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "pod is in phase Failed for 5 minutes."
        - alert: JobFailed
          expr: kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "job failed: {{ $labels.namespace }}/{{ $labels.job_name }}"
            description: "{{ $value }} failed pod(s) for this job."
        - alert: DaemonSetIncomplete
          expr: kube_daemonset_status_number_unavailable{daemonset!="falco"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "daemonset incomplete: {{ $labels.namespace }}/{{ $labels.daemonset }}"
            description: "{{ $value }} node(s) without a ready pod for 10 minutes."
        - alert: StatefulSetNotReady
          expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "statefulset short: {{ $labels.namespace }}/{{ $labels.statefulset }}"
            description: "fewer ready replicas than desired for 15 minutes."
    - name: cnpg.rules
      rules:
        - alert: CNPGReplicationLagHigh
          expr: cnpg_pg_replication_lag{namespace!="cluster-3"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High replication lag: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Replica is {{ $value | humanize }}s behind for 5 minutes."
        - alert: CNPGReplicationLagCritical
          expr: cnpg_pg_replication_lag{namespace!="cluster-3"} > 120
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL replication lag: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "Replica {{ $value | humanize }}s behind, may be unusable for failover."
        - alert: CNPGInstanceDown
          expr: cnpg_collector_up == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "cnpg instance down: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "cnpg metrics collector unreachable for 3 minutes."
        - alert: CNPGDelayedReplicaStuck
          expr: cnpg_pg_replication_lag{namespace="cluster-3"} > 600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "delayed replica stuck: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "cluster-3 is {{ $value | humanize }}s behind, expected about 300s."
        - alert: WALArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "wal archiving failing: {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "archiving to s3 failed in the last 10 minutes, point-in-time recovery is at risk."
        - alert: CNPGRowsDeletedSpike
          expr: |
            sum by (namespace) (rate(cnpg_pg_stat_database_tup_deleted{namespace="cluster-1"}[5m])) > 100
            and
            sum by (namespace) (rate(cnpg_pg_stat_database_tup_deleted{namespace="cluster-1"}[5m]))
              > 10 * sum by (namespace) (rate(cnpg_pg_stat_database_tup_deleted{namespace="cluster-1"}[6h] offset 5m))
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "mass delete on {{ $labels.namespace }}"
            description: "{{ $value | humanize }} rows/s deleted, over 10x the usual rate. cluster-3 replays it in 5 minutes: pause its replay now if this was not planned."
        - alert: CNPGRowsUpdatedSpike
          expr: |
            sum by (namespace) (rate(cnpg_pg_stat_database_tup_updated{namespace="cluster-1"}[5m])) > 100
            and
            sum by (namespace) (rate(cnpg_pg_stat_database_tup_updated{namespace="cluster-1"}[5m]))
              > 10 * sum by (namespace) (rate(cnpg_pg_stat_database_tup_updated{namespace="cluster-1"}[6h] offset 5m))
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "mass update on {{ $labels.namespace }}"
            description: "{{ $value | humanize }} rows/s updated, over 10x the usual rate. cluster-3 replays it in 5 minutes: pause its replay now if this was not planned."
        - alert: CNPGStackedInstances
          expr: count by (namespace, node) (kube_pod_info{namespace=~"cluster-[123]", created_by_kind="Cluster"}) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "two instances of {{ $labels.namespace }} on {{ $labels.node }}"
            description: "one node failure would take both instances of this cluster. they never move back on their own."
        - alert: CNPGBackupTooOld
          expr: time() - max by (namespace) (cnpg_collector_last_available_backup_timestamp) > 8 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "no recent base backup for {{ $labels.namespace }}"
            description: "last base backup is {{ $value | humanizeDuration }} old, expected every 6 hours."
    - name: platform.rules
      rules:
        - alert: ScrapeTargetDown
          expr: up{job!="node-exporter"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}"
            description: "target down for 5 minutes. after a netpol change, check for dropped flows first."
        - alert: EndpointDown
          expr: probe_success == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "endpoint down: {{ $labels.instance }}"
            description: "blackbox probe failing for 2 minutes."
    - name: kyverno.rules
      rules:
        - alert: KyvernoAdmissionDegraded
          expr: kube_deployment_status_replicas_available{namespace="kyverno", deployment="kyverno-admission-controller"} < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "kyverno admission controller has fewer than 2 ready replicas"
            description: "policies fail closed: if the last replica goes, no new pod can be admitted. {{ $value }} available."
        - alert: KyvernoAdmissionDown
          expr: absent(kube_deployment_status_replicas_available{namespace="kyverno", deployment="kyverno-admission-controller"}) or kube_deployment_status_replicas_available{namespace="kyverno", deployment="kyverno-admission-controller"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "kyverno admission controller is down"
            description: "no ready replicas: pods in application and node-agents, and pods using reserved priority classes, cannot be admitted until it returns."
    - name: meta.rules
      rules:
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
          annotations:
            summary: "alerting pipeline is alive"
        - alert: RuleEvaluationFailing
          expr: sum by (job, rule_group) (increase({__name__=~"(loki_)?prometheus_rule_evaluation_failures_total"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "rules in {{ $labels.rule_group }} are failing to evaluate on {{ $labels.job }}"
            description: "an alert rule that cannot evaluate can never fire. covers Prometheus and Loki's ruler."
        - alert: AlertSendingFailing
          expr: sum by (job) (rate({__name__=~"(loki_)?prometheus_notifications_errors_total"}[5m])) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} cannot deliver alerts to Alertmanager"
            description: "alerts are firing into nothing. check the Alertmanager pod and the L7 rule on 9093."
        - alert: PrometheusConfigReloadFailed
          expr: max by (pod) (prometheus_config_last_reload_successful) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus {{ $labels.pod }} rejected its last configuration"
            description: "it keeps running the previous configuration, so new monitors and rules are ignored."
        - alert: AlertmanagerConfigReloadFailed
          expr: max by (pod) (alertmanager_config_last_reload_successful) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Alertmanager {{ $labels.pod }} rejected its last configuration"
            description: "it keeps running the previous routes and receivers."
        - alert: AlertmanagerNotificationsFailing
          expr: sum by (integration) (rate(alertmanager_notifications_failed_total[5m])) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager cannot deliver through {{ $labels.integration }}"
            description: "alerts reach Alertmanager but never leave it."
    - name: log-pipeline.rules
      rules:
        - alert: AlloyDroppingLogs
          expr: sum by (node, reason) (increase(loki_write_dropped_entries_total[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: "Alloy on {{ $labels.node }} dropped log lines ({{ $labels.reason }})"
            description: "{{ $value }} lines gave up after every retry and are gone. audit lines and Postgres DDL may be among them."
        - alert: AlloyPushFailing
          expr: sum by (node, status_code) (rate(loki_write_request_duration_seconds_count{status_code!~"2.."}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Alloy on {{ $labels.node }} gets {{ $labels.status_code }} from Loki"
            description: "pushes are failing and being retried. a 403 means a Cilium L7 rule is refusing the push; drops follow once retries run out."
    - name: platform-monitoring.rules
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "longhorn volume {{ $labels.volume }} degraded"
            description: "volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has lost replicas and is rebuilding or running with fewer copies than configured."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "longhorn volume {{ $labels.volume }} faulted"
            description: "volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has no healthy replica left. the pod using it cannot read or write."
        - alert: GarageDiskLow
          expr: garage_local_disk_avail{volume="data"} / garage_local_disk_total{volume="data"} < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "garage disk low on {{ $labels.pod }}"
            description: "only {{ $value | humanizePercentage }} of garage's data disk is free. backups, logs and traces all land here."
        - alert: GarageDiskCritical
          expr: garage_local_disk_avail{volume="data"} / garage_local_disk_total{volume="data"} < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "garage disk almost full on {{ $labels.pod }}"
            description: "only {{ $value | humanizePercentage }} of garage's data disk is free. WAL archiving fails once it is full."
        - alert: CertificateExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 30 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "certificate on {{ $labels.instance }} expires soon"
            description: "the certificate served by {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."
        - alert: CertificateExpiryCritical
          expr: probe_ssl_earliest_cert_expiry - time() < 7 * 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "certificate on {{ $labels.instance }} expires within a week"
            description: "the certificate served by {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."
        - alert: EtcdNoLeader
          expr: etcd_server_has_leader == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "etcd member on {{ $labels.instance }} has no leader"
            description: "this etcd member cannot reach a leader. without quorum the API server cannot write anything."
        - alert: EtcdFrequentLeaderChanges
          expr: increase(etcd_server_leader_changes_seen_total[1h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd leader keeps changing"
            description: "{{ $value | humanize }} leader changes in the last hour on {{ $labels.instance }}. usually slow disks or a flaky network between nodes."
        - alert: EtcdDatabaseNearQuota
          expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd database near its size limit on {{ $labels.instance }}"
            description: "the etcd database uses {{ $value | humanizePercentage }} of its quota. at 100% etcd goes read-only."
        - alert: EtcdSlowDisk
          expr: histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd disk is slow on {{ $labels.instance }}"
            description: "99th percentile WAL fsync is {{ $value | humanizeDuration }}. etcd wants under 10ms; this causes leader elections."

apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: application
data:
  server.yml: |
    base-url: "http://wireguard"
    cache-file: "/var/lib/ntfy/cache.db"
    auth-file: "/var/lib/ntfy/auth.db"
    auth-default-access: "deny-all"
    behind-proxy: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: application
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: application
  labels:
    app: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.11.0
          args: ["serve"]
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: application
  labels:
    app: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ntfy-selfsigned
  namespace: application
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ntfy-tls
  namespace: application
spec:
  secretName: ntfy-tls
  issuerRef:
    name: ntfy-selfsigned
    kind: Issuer
  ipAddresses:
    - 192.168.100.82
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: application
spec:
  ingressClassName: traefik
  tls:
    - secretName: ntfy-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80

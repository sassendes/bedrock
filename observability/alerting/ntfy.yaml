apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: application
data:
  server.yml: |
    # base-url MUST be the exact url your phone subscribes with (e.g. http://<node-ip>:30080).
    # the ios app matches notifications to topics through it.
    base-url: "http://localhost"
    # ios gets pushes through apple, and apple only talks to ntfy.sh. this forwards a
    # "poll_request" (just the message id, never the content) to ntfy.sh, which wakes the
    # phone, which then fetches the real message from THIS server. needs outbound internet.
    upstream-base-url: "https://ntfy.sh"
    cache-file: "/var/lib/ntfy/cache.db"
    auth-file: "/var/lib/ntfy/auth.db"
    auth-default-access: "deny-all"
    behind-proxy: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: application
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: application
  labels:
    app: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.28.0
          args: ["serve"]
          # users / acl / tokens come from secrets/ntfy-auth.yaml and are re-applied on every start
          env:
            - name: NTFY_AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_USERS
            - name: NTFY_AUTH_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_ACCESS
            - name: NTFY_AUTH_TOKENS
              valueFrom:
                secretKeyRef:
                  name: ntfy-auth
                  key: NTFY_AUTH_TOKENS
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: "250m"
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
            - name: data
              mountPath: /var/lib/ntfy
      volumes:
        - name: config
          configMap:
            name: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: application
  labels:
    app: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

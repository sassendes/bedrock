apiVersion: v1
kind: Secret
metadata:
  name: loki-minio-creds
  namespace: application
type: Opaque
stringData:
  ACCESS_KEY_ID: lokiadmin
  SECRET_ACCESS_KEY: lokiadmin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki-minio
  namespace: application
spec:
  serviceName: loki-minio
  replicas: 1
  selector:
    matchLabels:
      app: loki-minio
  template:
    metadata:
      labels:
        app: loki-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: loki-minio-creds
                  key: ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loki-minio-creds
                  key: SECRET_ACCESS_KEY
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki-minio
  namespace: application
  labels:
    app: loki-minio
spec:
  selector:
    app: loki-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

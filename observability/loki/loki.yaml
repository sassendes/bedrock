apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: application
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    common:
      instance_addr: ${POD_IP}
      path_prefix: /loki
      replication_factor: 3
      ring:
        kvstore:
          store: memberlist
    memberlist:
      bind_port: 7946
      join_members:
        - loki-memberlist.application.svc.cluster.local:7946
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
      aws:
        s3: http://garage.garage.svc:3900/loki-data
        s3forcepathstyle: true
        region: garage
    limits_config:
      retention_period: 720h
      deletion_mode: disabled
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: s3
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      alertmanager_url: http://alertmanager-operated.application.svc:9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  annotations:
    configmap.reloader.stakater.com/reload: "loki-config"
  namespace: application
  labels:
    app: loki
spec:
  serviceName: loki-memberlist
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: loki
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: loki
          image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          args: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loki-data
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loki-data
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9095
              name: grpc
            - containerPort: 7946
              name: memberlist
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: rules
              mountPath: /loki/rules/fake
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: rules
          configMap:
            name: loki-rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: application
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki-memberlist
  namespace: application
  labels:
    app: loki
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: loki
  ports:
    - name: memberlist
      port: 7946
      targetPort: 7946
    - name: grpc
      port: 9095
      targetPort: 9095
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: application
data:
  postgres-ddl.yaml: |
    groups:
      - name: postgres-ddl
        rules:
          - alert: PostgresDropStatement
            expr: 'sum by (namespace, pod) (count_over_time({namespace=~"cluster-[123]"} |~ `(?i)(statement|execute [^:]*): .*\bdrop\b` [1m])) > 0'
            labels:
              severity: critical
            annotations:
              summary: "DROP in {{ $labels.namespace }} on {{ $labels.pod }}, cluster-3 replays it within 5 minutes"
      - name: log-pipeline
        rules:
          - alert: AuditLogSilent
            expr: 'absent_over_time({job="kube-audit"}[15m])'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "no API audit log has reached Loki for 20 minutes"
              description: "the audit log never goes quiet on a live cluster, so the log pipeline is broken somewhere between Alloy and Loki. PostgresDropStatement cannot fire while this is firing."

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:bedrock-secrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:bedrock-secrets
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: bedrock-replica-ca-sync
spec:
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchConditions:
      - name: cluster-1-ca-only
        expression: 'request.namespace == "cluster-1" && request.name == "cluster-1-ca"'
  rules:
    - name: ca-crt-to-cluster-2
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: [cluster-1]
              names: [cluster-1-ca]
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: cluster-1-ca-crt
        namespace: cluster-2
        data:
          type: Opaque
          data:
            ca.crt: "{{ request.object.data.\"ca.crt\" }}"
    - name: ca-crt-to-cluster-3
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: [cluster-1]
              names: [cluster-1-ca]
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: cluster-1-ca-crt
        namespace: cluster-3
        data:
          type: Opaque
          data:
            ca.crt: "{{ request.object.data.\"ca.crt\" }}"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: bedrock-replica-secret-sync
spec:
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 10
    matchConditions:
      - name: replica-namespaces-or-source
        expression: '(request.kind.kind == "Namespace" && request.name in ["cluster-2", "cluster-3"]) || (request.kind.kind == "Secret" && request.namespace == "cluster-1" && request.name == "cluster-1-replication")'
  rules:
    - name: clone-cluster-1-replication
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: [cluster-2, cluster-3]
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: cluster-1-replication
        namespace: "{{request.object.metadata.name}}"
        clone:
          namespace: cluster-1
          name: cluster-1-replication

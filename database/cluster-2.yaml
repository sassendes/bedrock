apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-2
  namespace: cluster-2
spec:
  monitoring:
    enablePodMonitor: true
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  storage:
    size: 10Gi
  enableSuperuserAccess: true
  superuserSecret:
    name: super-secret-2
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  bootstrap:
    recovery:
      source: cluster-1
  replica:
    enabled: true
    source: cluster-1
  externalClusters:
    - name: cluster-1
      connectionParameters:
        host: cluster-1-rw.cluster-1.svc
        user: streaming_replica
        dbname: app
        sslmode: verify-ca
      sslKey:
        name: cluster-1-replication
        key: tls.key
      sslCert:
        name: cluster-1-replication
        key: tls.crt
      sslRootCert:
        name: cluster-1-ca
        key: ca.crt
      barmanObjectStore:
        destinationPath: s3://cluster-1-backups/wals
        endpointURL: http://minio.cluster-1.svc:9000
        s3Credentials:
          accessKeyId:
            name: minio-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: minio-creds
            key: SECRET_ACCESS_KEY
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://cluster-2-backups/wals
      endpointURL: http://minio.cluster-2.svc:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: minio-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"

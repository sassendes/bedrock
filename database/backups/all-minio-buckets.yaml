apiVersion: batch/v1
kind: Job
metadata:
  name: minio-makebucket
  namespace: cluster-1
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
          env:
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: ACCESS_KEY_ID
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: SECRET_ACCESS_KEY
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 $KEY $SECRET
              mc mb --ignore-existing local/cluster-1-backups
---

apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cluster-1-scheduled-backup
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  namespace: cluster-1
spec:
  schedule: "0 0 */6 * * *"        # every 6 hours 
  immediate: false
  backupOwnerReference: self
  cluster:
    name: cluster-1
  method: barmanObjectStore

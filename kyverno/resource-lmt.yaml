apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - application
            - node-agents
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: |-
        (object.spec.containers + object.spec.?initContainers.orValue([])).all(c,
          'memory' in c.?resources.?limits.orValue({}) &&
          'cpu' in c.?resources.?limits.orValue({})
        )
      message: "cpu and memory limits are required on every container and init container"

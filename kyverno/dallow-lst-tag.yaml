apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
    matchConditions:
      - name: application-and-node-agents
        expression: 'request.namespace in ["application", "node-agents"]'
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pinned-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
                - node-agents
      validate:
        message: "every container, init container and ephemeral container needs an explicit tag that is not latest (a registry port is not a tag)"
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^(.*/)?[^/:@]+:[^/:@]+(@sha256:[0-9a-f]{64})?$', element.image) }}"
                    operator: Equals
                    value: false
                  - key: "{{ regex_match(':latest(@|$)', element.image) }}"
                    operator: Equals
                    value: true

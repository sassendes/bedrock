apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
    matchConditions:
      - name: application-and-node-agents
        expression: 'request.namespace in ["application", "node-agents"]'
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
                - node-agents
      validate:
        message: "an image tag is required (pin a version, no untagged images)"
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
                - node-agents
      validate:
        message: "using a mutable ':latest' tag is not allowed"
        pattern:
          spec:
            containers:
              - image: "!*:latest"

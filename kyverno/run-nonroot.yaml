apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: harden-run-as-nonroot
spec:
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
    matchConditions:
      - name: application-only
        expression: 'request.namespace == "application"'
  background: true
  rules:
    - name: inject-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(fsGroup): 1000
              +(fsGroupChangePolicy): OnRootMismatch
              +(seccompProfile):
                type: RuntimeDefault
    - name: inject-container-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      capabilities:
                        +(drop):
                          - ALL
    - name: inject-init-container-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - application
      preconditions:
        all:
          - key: "{{ length(request.object.spec.initContainers || `[]`) }}"
            operator: GreaterThan
            value: 0
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      capabilities:
                        +(drop):
                          - ALL

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: harden-run-as-nonroot
spec:
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - application
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: object.spec.?initContainers.orValue([])
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          (has(object.spec.securityContext) ? [] : [JSONPatch{op: "add", path: "/spec/securityContext", value: {}}]) +
          (object.spec.?securityContext.?runAsNonRoot.hasValue() ? [] : [JSONPatch{op: "add", path: "/spec/securityContext/runAsNonRoot", value: true}]) +
          (object.spec.?securityContext.?fsGroup.hasValue() ? [] : [JSONPatch{op: "add", path: "/spec/securityContext/fsGroup", value: 1000}]) +
          (object.spec.?securityContext.?fsGroupChangePolicy.hasValue() ? [] : [JSONPatch{op: "add", path: "/spec/securityContext/fsGroupChangePolicy", value: "OnRootMismatch"}]) +
          (object.spec.?securityContext.?seccompProfile.hasValue() ? [] : [JSONPatch{op: "add", path: "/spec/securityContext/seccompProfile", value: {"type": "RuntimeDefault"}}])
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          lists.range(size(variables.containers))
            .filter(i, !variables.containers[i].?securityContext.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext", value: {}}) +
          lists.range(size(variables.containers))
            .filter(i, !variables.containers[i].?securityContext.?allowPrivilegeEscalation.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext/allowPrivilegeEscalation", value: false}) +
          lists.range(size(variables.containers))
            .filter(i, !variables.containers[i].?securityContext.?capabilities.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext/capabilities", value: {"drop": ["ALL"]}}) +
          lists.range(size(variables.containers))
            .filter(i, variables.containers[i].?securityContext.?capabilities.hasValue() && !variables.containers[i].?securityContext.?capabilities.?drop.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/securityContext/capabilities/drop", value: ["ALL"]})
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          lists.range(size(variables.initContainers))
            .filter(i, !variables.initContainers[i].?securityContext.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext", value: {}}) +
          lists.range(size(variables.initContainers))
            .filter(i, !variables.initContainers[i].?securityContext.?allowPrivilegeEscalation.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext/allowPrivilegeEscalation", value: false}) +
          lists.range(size(variables.initContainers))
            .filter(i, !variables.initContainers[i].?securityContext.?capabilities.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext/capabilities", value: {"drop": ["ALL"]}}) +
          lists.range(size(variables.initContainers))
            .filter(i, variables.initContainers[i].?securityContext.?capabilities.hasValue() && !variables.initContainers[i].?securityContext.?capabilities.?drop.hasValue())
            .map(i, JSONPatch{op: "add", path: "/spec/initContainers/" + string(i) + "/securityContext/capabilities/drop", value: ["ALL"]})

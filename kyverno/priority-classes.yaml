apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-priority-classes
spec:
  validationActions:
    - Deny
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: priorityClass
      expression: object.spec.?priorityClassName.orValue("")
    - name: namespace
      expression: object.metadata.namespace
  validations:
    - expression: variables.priorityClass != "bedrock-storage" || variables.namespace == "garage"
      message: "bedrock-storage is reserved for garage"
    - expression: variables.priorityClass != "bedrock-data" || variables.namespace in ["cluster-1", "cluster-2", "cluster-3", "falco"]
      message: "bedrock-data is reserved for the database clusters, their poolers and falco"
    - expression: '!(variables.priorityClass in ["system-cluster-critical", "system-node-critical"]) || variables.namespace in ["kube-system", "kyverno"]'
      message: "system-cluster-critical and system-node-critical are reserved for kube-system and kyverno"

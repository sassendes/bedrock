apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - application
            - node-agents
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: images
      expression: |-
        object.spec.?ephemeralContainers.orValue([]).map(c, c.image) +
        object.spec.?initContainers.orValue([]).map(c, c.image) +
        object.spec.containers.map(c, c.image)
  validations:
    - expression: |-
        variables.images.all(i,
          i.matches(r'^(.*/)?[^/:@]+:[^/:@]+(@sha256:[0-9a-f]{64})?$') &&
          !i.matches(r':latest(@|$)')
        )
      message: "every container, init container and ephemeral container needs an explicit tag that is not latest (a registry port is not a tag)"

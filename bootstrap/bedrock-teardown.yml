---
- name: Tear down bedrock cleanly on all nodes
  hosts: k3s_servers
  become: true
  tasks:
    - name: Uninstall RKE2 (ignore if already gone)
      ansible.builtin.command: /usr/local/bin/rke2-uninstall.sh
      args:
        removes: /usr/local/bin/rke2-uninstall.sh

    - name: Wipe RKE2 state incl. etcd db
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher/rke2
        - /etc/rancher/rke2

    - name: Remove CIS kernel parameters file
      ansible.builtin.file:
        path: /etc/sysctl.d/60-rke2-cis.conf
        state: absent

    - name: Wipe Longhorn on-disk state (kills faulted zombie volumes)
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: absent

    - name: Recreate empty Longhorn dir
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        mode: "0755"

    - name: Wipe Rook/Ceph host state (mon db, keys - stale state here breaks the next mon quorum)
      ansible.builtin.file:
        path: /var/lib/rook
        state: absent

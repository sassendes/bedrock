---
- name: Node prerequisites (all nodes)
  hosts: rke2_servers
  become: true
  vars:
    rke2_version: v1.36.4+rke2r1
  tasks:
    - name: Install open-iscsi + nfs-common
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
          - curl
          - jq
          - lvm2
          - cryptsetup
        update_cache: true
        state: present

    - name: Load dm_crypt on boot for Longhorn volume encryption
      ansible.builtin.copy:
        dest: /etc/modules-load.d/dm_crypt.conf
        content: "dm_crypt\n"
        mode: "0644"

    - name: Load dm_crypt now
      ansible.builtin.command: modprobe dm_crypt
      changed_when: false

    - name: Enable and start iscsid
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Create etcd system user (required by the CIS profile)
      ansible.builtin.user:
        name: etcd
        comment: etcd user
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Download RKE2 {{ rke2_version }} (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/rancher/rke2/releases/download/{{ rke2_version | urlencode }}/rke2.linux-amd64.tar.gz"
        dest: /tmp/rke2.linux-amd64.tar.gz
        checksum: "sha256:https://github.com/rancher/rke2/releases/download/{{ rke2_version | urlencode }}/sha256sum-amd64.txt"
        mode: "0644"
        timeout: 120
      register: rke2_dl
      until: rke2_dl is succeeded
      retries: 5
      delay: 10

    - name: Install RKE2 into /usr/local
      ansible.builtin.unarchive:
        src: /tmp/rke2.linux-amd64.tar.gz
        dest: /usr/local
        remote_src: true
        creates: /usr/local/bin/rke2

    - name: Load the rke2-server unit
      ansible.builtin.systemd:
        daemon_reload: true

    - name: CIS kernel parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-rke2-cis.conf
        mode: "0644"
        content: |
          vm.panic_on_oom=0
          vm.overcommit_memory=1
          kernel.panic=10
          kernel.panic_on_oops=1
          fs.inotify.max_user_instances=8192
          fs.inotify.max_user_watches=524288
      register: cis_sysctl

    - name: Apply kernel parameters
      ansible.builtin.command: sysctl --system
      when: cis_sysctl.changed

    - name: Create RKE2 config directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Audit policy
      ansible.builtin.copy:
        src: audit-policy.yaml
        dest: /etc/rancher/rke2/bedrock-audit.yaml
        mode: "0600"


    - name: Create RKE2 server manifests directory
      ansible.builtin.file:
        path: /var/lib/rancher/rke2/server/manifests
        state: directory
        mode: "0755"

    - name: Cilium config (Hubble)
      ansible.builtin.copy:
        src: rke2-cilium-config.yaml
        dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
        mode: "0600"

        
- name: Bring up RKE2 control-plane (first server)
  hosts: server_init
  become: true
  tasks:
    - name: Write RKE2 config (first server)
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0600"
        content: |
          profile: cis
          cni: cilium
          disable-kube-proxy: true
          tls-san: {{ groups['rke2_servers'] | map('extract', hostvars, 'ansible_host') | list | to_json }}
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
          etcd-expose-metrics: true
          audit-policy-file: /etc/rancher/rke2/bedrock-audit.yaml
          disable:
            - rke2-traefik
          kube-apiserver-arg:
            - "enable-admission-plugins=NodeRestriction,DenyServiceExternalIPs"
          kubelet-arg:
            - "pod-max-pids=4096"
            - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"

    - name: Start rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        enabled: true
        state: started

    - name: Wait for node-token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/rke2/server/node-token
        timeout: 900

    - name: Read the node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      register: rke2_token_raw
      no_log: true

    - name: Stash token + URLs as facts
      ansible.builtin.set_fact:
        rke2_token: "{{ rke2_token_raw.content | b64decode | trim }}"
        rke2_join_url: "https://{{ ansible_host }}:9345"
        rke2_api_url: "https://{{ ansible_host }}:6443"
      no_log: true

    - name: Wait for kubeconfig
      ansible.builtin.wait_for:
        path: /etc/rancher/rke2/rke2.yaml
        timeout: 900

    - name: Private kubeconfig directory on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.bedrock"
        state: directory
        mode: "0700"

    - name: Fetch kubeconfig to the controller
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
        flat: true

    - name: Rewrite kubeconfig 127.0.0.1 -> real IP
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "{{ rke2_api_url }}"

    - name: Kubeconfig readable by its owner only
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
        mode: "0600"

- name: Join remaining servers to HA control plane (one at a time)
  hosts: server_join
  become: true
  serial: 1
  tasks:
    - name: Write RKE2 config (joining server)
      no_log: true
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0600"
        content: |
          server: {{ hostvars[groups['server_init'][0]].rke2_join_url }}
          token: {{ hostvars[groups['server_init'][0]].rke2_token }}
          profile: cis
          cni: cilium
          disable-kube-proxy: true
          tls-san: {{ groups['rke2_servers'] | map('extract', hostvars, 'ansible_host') | list | to_json }}
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
          etcd-expose-metrics: true
          audit-policy-file: /etc/rancher/rke2/bedrock-audit.yaml
          disable:
            - rke2-traefik
          kube-apiserver-arg:
            - "enable-admission-plugins=NodeRestriction,DenyServiceExternalIPs"
          kubelet-arg:
            - "pod-max-pids=4096"
            - "tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"

    - name: Start rke2-server
      ansible.builtin.systemd:
        name: rke2-server
        enabled: true
        state: started

    - name: Wait for this server's kubeconfig (joined and running)
      ansible.builtin.wait_for:
        path: /etc/rancher/rke2/rke2.yaml
        timeout: 900

- name: kubectl on every node
  hosts: rke2_servers
  become: true
  tasks:
    - name: Link RKE2 tools into PATH
      ansible.builtin.file:
        src: "/var/lib/rancher/rke2/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kubectl
        - crictl
        - ctr

    - name: Point kubectl at the RKE2 kubeconfig for every login shell
      ansible.builtin.copy:
        dest: /etc/profile.d/rke2.sh
        mode: "0644"
        content: |
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          export CRI_CONFIG_FILE=/var/lib/rancher/rke2/agent/etc/crictl.yaml

    - name: etcd config owned by root (CIS 1.1.8)
      ansible.builtin.file:
        path: /var/lib/rancher/rke2/server/db/etcd/config
        owner: root
        group: root

    - name: PKI certificates mode 600 (CIS 1.1.20)
      ansible.builtin.shell: chmod 600 /var/lib/rancher/rke2/server/tls/*.crt
      changed_when: false

- name: Deploy bedrock platform stack (ordered, gated)
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
    repo_root: "{{ playbook_dir }}/.."
    nats_enabled: false
    redis_enabled: false
    kafka_enabled: false
  environment:
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Wait for Kubernetes API to answer
      ansible.builtin.command: kubectl get --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: api_ready
      until: api_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Apply namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/platform/namespace.yaml"


    - name: Apply priority classes
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/platform/priorityclasses.yaml"

    - name: Download Kyverno v1.19.1 (checksum verified)
      ansible.builtin.get_url:
        url: https://github.com/kyverno/kyverno/releases/download/v1.19.1/install.yaml
        dest: /tmp/kyverno-1.19.1.yaml
        checksum: sha256:d3322cb346d3d42dd0f41e230b0d1d7bc5619960e1c36fdac4d9151d724b88e6
        mode: "0644"
        timeout: 120
      register: kyverno_dl
      until: kyverno_dl is succeeded
      retries: 5
      delay: 10

    - name: Install Kyverno v1.19.1 (policy admission must exist before validated workloads)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f /tmp/kyverno-1.19.1.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kyverno_install
      until: kyverno_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for kyverno admission-controller Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: kyverno
        name: kyverno-admission-controller
      register: kyverno_ac
      until: >
        kyverno_ac.resources |default([]) |  length > 0 and
        (kyverno_ac.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Kyverno admission controller to 3 replicas (fail-closed needs no single point of failure)
      ansible.builtin.command: kubectl -n kyverno scale deployment kyverno-admission-controller --replicas=3
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Kyverno admission controller on top priority, one replica per node
      ansible.builtin.command: >
        kubectl -n kyverno patch deployment kyverno-admission-controller --type merge
        -p '{"spec":{"template":{"spec":{"priorityClassName":"system-cluster-critical","affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchLabels":{"app.kubernetes.io/component":"admission-controller","app.kubernetes.io/instance":"kyverno"}},"topologyKey":"kubernetes.io/hostname"}]}}}}}}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Kyverno background controller on top priority (keeps cloned secrets in sync)
      ansible.builtin.command: >
        kubectl -n kyverno patch deployment kyverno-background-controller --type merge
        -p '{"spec":{"template":{"spec":{"priorityClassName":"system-cluster-critical"}}}}'
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for the kyverno admission controller rollout
      ansible.builtin.command: kubectl -n kyverno rollout status deployment/kyverno-admission-controller --timeout=600s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false


    - name: Apply Kyverno policies
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/kyverno/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kyverno_apply
      until: kyverno_apply.rc == 0
      retries: 10
      delay: 10

    - name: Apply secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/secrets/user-secret-1.yaml"
        - "{{ repo_root }}/secrets/garage-secrets.yaml"
        - "{{repo_root }}/secrets/nats-auth.yaml"
        - "{{repo_root }}/secrets/redis-auth.yaml"
        - "{{ repo_root }}/secrets/grafana-admin.yaml"

    - name: Download Longhorn v1.13.0 (checksum verified)
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/longhorn/longhorn/v1.13.0/deploy/longhorn.yaml
        dest: /tmp/longhorn-1.13.0.yaml
        checksum: sha256:d0f99488e7b2789312d45b0127ce7388df71a971e6fca2085e88635303cc0a1f
        mode: "0644"
        timeout: 120
      register: longhorn_dl
      until: longhorn_dl is succeeded
      retries: 5
      delay: 10

    - name: Longhorn RBAC without wildcards (CIS 5.1.3), RBAC rule keeps bind and escalate
      ansible.builtin.replace:
        path: /tmp/longhorn-1.13.0.yaml
        regexp: 'resources: \["clusterrolebindings", "clusterroles"\]\n  verbs: \["\*"\]'
        replace: 'resources: ["clusterrolebindings", "clusterroles"]\n  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection", "bind", "escalate"]'

    - name: Longhorn RBAC without wildcards (CIS 5.1.3), remaining rules
      ansible.builtin.replace:
        path: /tmp/longhorn-1.13.0.yaml
        regexp: 'verbs: \["\*"\]'
        replace: 'verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]'

    - name: Longhorn RBAC without wildcards (CIS 5.1.3), CRD rule
      ansible.builtin.replace:
        path: /tmp/longhorn-1.13.0.yaml
        regexp: 'verbs:\n  - "\*"'
        replace: 'verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]'

    - name: Apply Longhorn v1.13.0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: /tmp/longhorn-1.13.0.yaml

    - name: Remove the Longhorn CSI cluster-wide Secret read (opt-out documented by Longhorn)
      ansible.builtin.command: kubectl delete clusterrolebinding longhorn-csi-secret-bind --ignore-not-found
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for longhorn-driver-deployer Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: longhorn-system
        name: longhorn-driver-deployer
      register: lh
      until: >
        lh.resources | default([]) | length > 0 and
        (lh.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Longhorn settings
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/storage/longhorn-settings.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: lh_settings
      until: lh_settings.rc == 0
      retries: 10
      delay: 10

    - name: Download CNPG operator v1.30.1 (checksum verified)
      ansible.builtin.get_url:
        url: https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
        dest: /tmp/cnpg-1.30.1.yaml
        checksum: sha256:37237f145d8138256ea25ae830f87759255665ff08f8d552fdd8224a5ec032fb
        mode: "0644"
        timeout: 120
      register: cnpg_dl
      until: cnpg_dl is succeeded
      retries: 5
      delay: 10

    - name: Apply CNPG operator v1.30.1

  
    - name: Apply CNPG operator v1.30.1
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        server_side_apply:
          field_manager: bedrock-ansible
        src: /tmp/cnpg-1.30.1.yaml

    - name: Wait for CNPG controller Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: cnpg-system
        name: cnpg-controller-manager
      register: cnpg
      until: >
        cnpg.resources | default([]) | length > 0 and
        (cnpg.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 90
      delay: 10

    - name: Download Prometheus operator v0.93.1 bundle
      ansible.builtin.get_url:
        url: https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.93.1/bundle.yaml
        dest: /tmp/prometheus-operator-0.93.1.yaml
        checksum: sha256:1d38ea4ab904545f3203862c1a793b18fd53ab1e571fdbf47afb4dc9e33a98b8
        mode: "0644"
        timeout: 120
      register: promop_dl
      until: promop_dl is succeeded
      retries: 5
      delay: 10

    - name: Move Prometheus operator out of default
      ansible.builtin.replace:
        path: /tmp/prometheus-operator-0.93.1.yaml
        regexp: 'namespace: default$'
        replace: 'namespace: prometheus-operator'

    - name: Prometheus operator RBAC without wildcards (CIS 5.1.3)
      ansible.builtin.replace:
        path: /tmp/prometheus-operator-0.93.1.yaml
        regexp: "verbs:\n  - '\\*'"
        replace: "verbs: [get, list, watch, create, update, patch, delete, deletecollection]"

    - name: Apply Prometheus operator v0.93.1
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f /tmp/prometheus-operator-0.93.1.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: prom_install
      until: prom_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for prometheus-operator Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: prometheus-operator
        name: prometheus-operator
      register: promop
      until: >
        promop.resources | default([]) | length > 0 and
        (promop.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Apply Longhorn encryption key and longhorn-local storage class
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/secrets/longhorn-crypto.yaml"
        - "{{ repo_root }}/storage/longhorn-local.yaml"
      
    - name: Apply garage
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/storage/garage.yaml"

    - name: Apply garage init job
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/storage/buckets.yaml"

    - name: Wait for garage init job complete
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Job
        namespace: garage
        name: garage-init
      register: gjob
      until: >
        gjob.resources | default([]) | length > 0 and
        (gjob.resources[0].status.succeeded | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Revoke garage-init's secret access once its job is done
      ansible.builtin.command: kubectl -n {{ item }} delete rolebinding garage-init --ignore-not-found
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - cluster-1
        - cluster-2
        - cluster-3
        - application

    - name: Apply CNPG cluster-1 (primary)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/cluster-1.yaml"

    - name: Wait for cluster-1 primary healthy
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: cluster-1
        name: cluster-1
      register: c1
      until: >
        c1.resources | default([]) | length > 0 and
        (c1.resources[0].status.readyInstances | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Take the first cluster-1 base backup (replicas bootstrap from it)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/backups/cluster-1-initial-backup.yaml"

    - name: Wait for the first cluster-1 base backup completed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Backup
        namespace: cluster-1
        name: cluster-1-initial
      register: c1_backup
      until: >
        c1_backup.resources | default([]) | length > 0 and
        (c1_backup.resources[0].status.phase | default('')) == 'completed'
      retries: 40
      delay: 15

    - name: Apply kyverno secret sync (clones cluster-1 ca / replication into cluster-2 and cluster-3)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/replica-secret-sync.yaml"
      register: secret_sync
      until: secret_sync is succeeded
      retries: 10
      delay: 6

    - name: Wait for the cloned secrets to land in the replica namespaces
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: "{{ item.0 }}"
        name: "{{ item.1 }}"
      register: cloned
      until: cloned.resources | default([]) | length > 0
      retries: 30
      delay: 10
      loop: "{{ ['cluster-2', 'cluster-3'] | product(['cluster-1-ca', 'cluster-1-replication', 'cluster-1-backups-ro']) | list }}"

    - name: Apply replica clusters 2 and 3
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/database/cluster-2.yaml"
        - "{{ repo_root }}/database/cluster-3.yaml"

    - name: Apply pooler + scheduled backups
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/database/pooler.yaml"
        - "{{ repo_root }}/database/backups/cluster-1-scheduled-backup-.yaml"
        - "{{ repo_root }}/database/backups/replicas-scheduled-backups.yaml"

    - name: Apply NATS JetStream
      when: nats_enabled | bool
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/event-buses/nats.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for NATS ready
      when: nats_enabled | bool
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StatefulSet
        namespace: nats
        name: nats
      register: nats_sts
      until: >
        nats_sts.resources | default([]) | length > 0 and
        (nats_sts.resources[0].status.readyReplicas | default(0)) >= 3
      retries: 40
      delay: 15

    - name: Apply Redis
      when: redis_enabled | bool
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/event-buses/redis.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Redis ready
      when: redis_enabled | bool
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StatefulSet
        namespace: redis
        name: redis
      register: redis_sts
      until: >
        redis_sts.resources | default([]) | length > 0 and
        (redis_sts.resources[0].status.readyReplicas | default(0)) >= 3
      retries: 40
      delay: 15


    - name: Download Strimzi 1.2.0 (checksum verified)
      when: kafka_enabled | bool
      ansible.builtin.get_url:
        url: https://github.com/strimzi/strimzi-kafka-operator/releases/download/1.2.0/strimzi-cluster-operator-1.2.0.yaml
        dest: /tmp/strimzi-cluster-operator.yaml
        checksum: "sha256:a0b1ae3e375a7da0674eb3894df8aa955bc50abe8190bc9344e30b83bbee4775"
        mode: "0644"
        timeout: 120
      register: strimzi_dl
      until: strimzi_dl is succeeded
      retries: 5
      delay: 10

    - name: Point Strimzi at the kafka namespace
      when: kafka_enabled | bool
      ansible.builtin.replace:
        path: /tmp/strimzi-cluster-operator.yaml
        regexp: 'namespace: myproject'
        replace: 'namespace: kafka'

    - name: Install Strimzi operator
      when: kafka_enabled | bool
      ansible.builtin.command: kubectl apply --server-side -n kafka -f /tmp/strimzi-cluster-operator.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Strimzi creates restricted pods
      when: kafka_enabled | bool
      ansible.builtin.command: kubectl -n kafka set env deployment/strimzi-cluster-operator STRIMZI_POD_SECURITY_PROVIDER_CLASS=restricted
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Strimzi operator
      when: kafka_enabled | bool
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: kafka
        name: strimzi-cluster-operator
      register: strimzi
      until: >
        strimzi.resources | default([]) | length > 0 and
        (strimzi.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Apply Kafka
      when: kafka_enabled | bool
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/event-buses/kafka.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Wait for Kafka Ready
      when: kafka_enabled | bool
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: kafka.strimzi.io/v1
        kind: Kafka
        namespace: kafka
        name: kafka
      register: kafka_cr
      until: >
        kafka_cr.resources | default([]) | length > 0 and
        (kafka_cr.resources[0].status.conditions | default([])
         | selectattr('type', 'equalto', 'Ready')
         | selectattr('status', 'equalto', 'True') | list | length) > 0
      retries: 60
      delay: 15

    - name: Apply Loki stack
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/loki/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Tempo
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/tempo/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Prometheus scrape configs + exporters
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/prometheus/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply alerting
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/alerting/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Grafana
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/observability/grafana/grafana.yaml"

    - name: Apply OpenCost
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/opencost/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Falco
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/falco/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Reloader
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/platform/reloader.yaml"

    - name: Wait for Reloader Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: reloader
        name: reloader
      register: reloader_dep
      until: >
        reloader_dep.resources | default([]) | length > 0 and
        (reloader_dep.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 60
      delay: 10

    - name: Disable token automount on default service accounts
      ansible.builtin.shell: |
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}'); do
          kubectl patch serviceaccount default -n "$ns" \
            -p '{"automountServiceAccountToken": false}'
        done
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Apply Grafana dashboards (via kubectl - large JSON blobs, server-side)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts -f "{{ item }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - "{{ repo_root }}/observability/grafana/dash-cnpg.yaml"
        - "{{ repo_root }}/observability/grafana/dash-node.yaml"


    - name: Apply network policies
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/netpols/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Verify the cluster-wide default deny landed
      ansible.builtin.command: kubectl get ciliumclusterwidenetworkpolicy cluster-default-deny
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

    - name: Verify every namespace running pods has its own network policy
      ansible.builtin.shell: |
        set -eu
        missing=""
        for ns in $(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' | sort -u); do
          if [ "$(kubectl get cnp -n "$ns" --no-headers 2>/dev/null | wc -l)" -eq 0 ]; then missing="$missing $ns"; fi
        done
        if [ -n "$missing" ]; then echo "namespaces without a network policy:$missing"; exit 1; fi
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: false

---
- name: Node prerequisites (all nodes)
  hosts: k3s_servers
  become: true
  tasks:
    - name: Install open-iscsi + nfs-common + lvm2 (ceph osd)
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
          - curl
          - jq
          - lvm2
        update_cache: true
        state: present

    - name: Enable and start iscsid
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started


- name: Bring up k3s control-plane (cluster-init)
  hosts: server_init
  become: true
  tasks:
    - name: Install k3s server with embedded etcd (cluster-init)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server --cluster-init
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Wait for node-token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read the full node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Stash token + server URL as facts
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
        k3s_url: "https://{{ ansible_host }}:6443"

    - name: Fetch kubeconfig to the controller
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/bedrock-kubeconfig
        flat: true

    - name: Rewrite kubeconfig 127.0.0.1 -> real IP
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: /tmp/bedrock-kubeconfig
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "{{ k3s_url }}"


- name: Join remaining servers to HA control plane
  hosts: server_join
  become: true
  tasks:
    - name: Install k3s as joining server (full token)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --server {{ hostvars[groups['server_init'][0]].k3s_url }} \
          --token {{ hostvars[groups['server_init'][0]].k3s_token }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml


- name: Deploy bedrock platform stack (ordered, gated)
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    kubeconfig: /tmp/bedrock-kubeconfig
    repo_root: "{{ playbook_dir }}/.."
  tasks:
    - name: Wait for Kubernetes API to answer
      ansible.builtin.command: kubectl get --raw=/readyz
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: api_ready
      until: api_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
    - name: Apply namespaces
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/namespace.yaml"

    - name: Install Kyverno v1.19.1 (policy admission must exist before validated workloads)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://github.com/kyverno/kyverno/releases/download/v1.19.1/install.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kyverno_install
      until: kyverno_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for kyverno admission-controller Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: kyverno
        name: kyverno-admission-controller
      register: kyverno_ac
      until: >
        kyverno_ac.resources |default([]) |  length > 0 and
        (kyverno_ac.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Apply Kyverno policies
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/kyverno/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: kyverno_apply
      until: kyverno_apply.rc == 0
      retries: 10
      delay: 10

    - name: Apply secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/secrets/super-secret-1.yaml"
        - "{{ repo_root }}/secrets/super-secret-2.yaml"
        - "{{ repo_root }}/secrets/super-secret-3.yaml"
        - "{{ repo_root }}/secrets/user-secret-1.yaml"
        - "{{ repo_root }}/secrets/user-secret-2.yaml"
        - "{{ repo_root }}/secrets/user-secret-3.yaml"

    - name: Apply Longhorn v1.7.3
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "https://raw.githubusercontent.com/longhorn/longhorn/v1.7.3/deploy/longhorn.yaml"

    - name: Wait for longhorn-driver-deployer Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: longhorn-system
        name: longhorn-driver-deployer
      register: lh
      until: >
        lh.resources | default([]) | length > 0 and
        (lh.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Apply CNPG operator v1.27.0
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        server_side_apply:
          field_manager: bedrock-ansible
        src: "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.0.yaml"

    - name: Wait for CNPG controller Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: cnpg-system
        name: cnpg-controller-manager
      register: cnpg
      until: >
        cnpg.resources | default([]) | length > 0 and
        (cnpg.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Apply Prometheus operator v0.93.1 (via kubectl - bundle YAML breaks ansible parser)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.93.1/bundle.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: prom_install
      until: prom_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for prometheus-operator Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: default
        name: prometheus-operator
      register: promop
      until: >
        promop.resources | default([]) | length > 0 and
        (promop.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 30
      delay: 10

    - name: Install Rook v1.20.7 (crds, common, csi-operator, operator - in that order)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts
        -f https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/crds.yaml
        -f https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/common.yaml
        -f https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/csi-operator.yaml
        -f https://raw.githubusercontent.com/rook/rook/v1.20.7/deploy/examples/operator.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: rook_install
      until: rook_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for rook-ceph-operator Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: rook-ceph
        name: rook-ceph-operator
      register: rookop
      until: >
        rookop.resources | default([]) | length > 0 and
        (rookop.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 90
      delay: 10
      
    - name: Remove unused ceph csi drivers (ceph is s3 only, longhorn does volumes)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: csi.ceph.io/v1
        kind: Driver
        namespace: rook-ceph
        name: "{{ item }}"
      loop:
        - rook-ceph.rbd.csi.ceph.com
        - rook-ceph.cephfs.csi.ceph.com
        
    - name: Load storage/ceph-cluster.yaml
      ansible.builtin.set_fact:
        ceph_docs: "{{ lookup('file', repo_root + '/storage/ceph-cluster.yaml') | from_yaml_all | select | list }}"

    - name: Apply any StorageClass defined in ceph-cluster.yaml (the longhorn osd class by default)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ item }}"
      loop: "{{ ceph_docs | selectattr('kind', 'equalto', 'StorageClass') | list }}"

    - name: Read which storageClass the osds ask for (empty = cluster default)
      ansible.builtin.set_fact:
        osd_sc_name: >-
          {{ (ceph_docs | selectattr('kind', 'equalto', 'CephCluster') | first)
             .spec.storage.storageClassDeviceSets[0].volumeClaimTemplates[0].spec.storageClassName
             | default('') }}

    - name: List storageClasses
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: StorageClass
      register: all_sc

    - name: Resolve the osd storageClass (named one, or the newest default)
      ansible.builtin.set_fact:
        osd_sc: >-
          {%- if osd_sc_name | length > 0 -%}
          {{ all_sc.resources | selectattr('metadata.name', 'equalto', osd_sc_name) | list }}
          {%- else -%}
          {%- set d = [] -%}
          {%- for sc in all_sc.resources | sort(attribute='metadata.creationTimestamp', reverse=true) -%}
          {%- if (sc.metadata.annotations | default({})).get('storageclass.kubernetes.io/is-default-class') == 'true' -%}
          {%- set _ = d.append(sc) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ d }}
          {%- endif -%}

    - name: Preflight - osd storageClass must exist and must be able to do block volumes
      ansible.builtin.fail:
        msg: >-
          ceph osd storageClass '{{ osd_sc_name | default('', true) or '<cluster default>' }}'
          {{ 'does not exist' if osd_sc | length == 0 else
             'uses provisioner ' + osd_sc[0].provisioner + ' which cannot hand out block volumes' }}.
          set storageClassName in storage/ceph-cluster.yaml to a block-capable class (longhorn, cloud block storage, openebs, topolvm, rbd).
      when: >
        osd_sc | length == 0 or
        osd_sc[0].provisioner in ['rancher.io/local-path', 'nfs.csi.k8s.io',
                                  'cluster.local/nfs-subdir-external-provisioner',
                                  'k8s-sigs.io/nfs-subdir-external-provisioner',
                                  'kubernetes.io/no-provisioner']

    - name: Apply CephCluster
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition: "{{ ceph_docs | selectattr('kind', 'equalto', 'CephCluster') | first }}"

    - name: Wait for CephCluster Ready (mons + mgr + osds, slow on first boot)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: ceph.rook.io/v1
        kind: CephCluster
        namespace: rook-ceph
        name: rook-ceph
      register: ceph
      until: >
        ceph.resources | default([]) | length > 0 and
        (ceph.resources[0].status.phase | default('')) == 'Ready'
      retries: 80
      delay: 15

    - name: Apply object store (rgw) + bucket StorageClass
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/storage/object-store.yaml"

    - name: Wait for CephObjectStore Ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: ceph.rook.io/v1
        kind: CephObjectStore
        namespace: rook-ceph
        name: bedrock-s3
      register: rgw
      until: >
        rgw.resources | default([]) | length > 0 and
        (rgw.resources[0].status.phase | default('')) == 'Ready'
      retries: 60
      delay: 15

    - name: Apply bucket claims (creates buckets + per-bucket creds)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/storage/buckets.yaml"

    - name: Wait for every bucket claim Bound (creds secret exists after this)
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: objectbucket.io/v1alpha1
        kind: ObjectBucketClaim
        namespace: "{{ item.ns }}"
        name: "{{ item.name }}"
      register: obc
      until: >
        obc.resources | default([]) | length > 0 and
        (obc.resources[0].status.phase | default('')) == 'Bound'
      retries: 30
      delay: 10
      loop:
        - { ns: cluster-1, name: cluster-1-backups }
        - { ns: cluster-2, name: cluster-2-backups }
        - { ns: cluster-3, name: cluster-3-backups }
        - { ns: application, name: loki-data }

    - name: Create argocd namespace
      ansible.builtin.command: >
        kubectl create namespace argocd --dry-run=client -o yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: argocd_ns_manifest
      changed_when: false

    - name: Apply argocd namespace
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: "{{ argocd_ns_manifest.stdout }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: argocd_ns
      until: argocd_ns.rc == 0
      retries: 6
      delay: 10

    - name: Install ArgoCD v3.5.3
      ansible.builtin.command: >
        kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: argocd_install
      until: argocd_install.rc == 0
      retries: 10
      delay: 15

    - name: Wait for argocd-server Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: argocd
        name: argocd-server
      register: argocd_srv
      until: >
        argocd_srv.resources | default([]) | length > 0 and
        (argocd_srv.resources[0].status.availableReplicas | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Apply CNPG cluster-1 (primary)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/cluster-1.yaml"

    - name: Wait for cluster-1 primary healthy
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: cluster-1
        name: cluster-1
      register: c1
      until: >
        c1.resources | default([]) | length > 0 and
        (c1.resources[0].status.readyInstances | default(0)) >= 1
      retries: 40
      delay: 15

    - name: Take the first cluster-1 base backup (replicas bootstrap from it)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/backups/cluster-1-initial-backup.yaml"

    - name: Wait for the first cluster-1 base backup completed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Backup
        namespace: cluster-1
        name: cluster-1-initial
      register: c1_backup
      until: >
        c1_backup.resources | default([]) | length > 0 and
        (c1_backup.resources[0].status.phase | default('')) == 'completed'
      retries: 40
      delay: 15

    - name: Apply kyverno secret sync (clones cluster-1 ca / replication / bucket creds into cluster-2 and cluster-3)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/database/replica-secret-sync.yaml"
      # kyverno refuses the policy until the aggregated secrets role has landed. retry covers that race.
      register: secret_sync
      until: secret_sync is succeeded
      retries: 10
      delay: 6

    - name: Wait for the cloned secrets to land in the replica namespaces
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: "{{ item.0 }}"
        name: "{{ item.1 }}"
      register: cloned
      until: cloned.resources | default([]) | length > 0
      retries: 30
      delay: 10
      loop: "{{ ['cluster-2', 'cluster-3'] | product(['cluster-1-ca', 'cluster-1-replication', 'cluster-1-backups']) | list }}"

    - name: Apply replica clusters 2 and 3
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/database/cluster-2.yaml"
        - "{{ repo_root }}/database/cluster-3.yaml"

    - name: Apply pooler + scheduled backups
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ item }}"
      loop:
        - "{{ repo_root }}/database/pooler.yaml"
        - "{{ repo_root }}/database/backups/cluster-1-scheduled-backup-.yaml"
        - "{{ repo_root }}/database/backups/replicas-scheduled-backups.yaml"

    - name: Apply Loki stack
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/loki/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply Prometheus scrape configs + exporters
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/prometheus/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply alerting
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/observability/alerting/
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
    - name: Apply Grafana
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ repo_root }}/observability/grafana/grafana.yaml"

    - name: Apply Grafana dashboards (via kubectl - large JSON blobs, server-side)
      ansible.builtin.command: >
        kubectl apply --server-side --force-conflicts -f "{{ item }}"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop:
        - "{{ repo_root }}/observability/grafana/dash-cnpg.yaml"
        - "{{ repo_root }}/observability/grafana/dash-node.yaml"

    - name: Teach ArgoCD health for child apps + cnpg backups (waves wait on these)
      ansible.builtin.command: >
        kubectl -n argocd patch configmap argocd-cm --type merge
        --patch-file {{ repo_root }}/pipeline/argocd-health.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: argocd_cm
      until: argocd_cm.rc == 0
      retries: 6
      delay: 10

    - name: Point ArgoCD at the bedrock repo (GitOps takeover)
      ansible.builtin.command: kubectl apply -f {{ repo_root }}/pipeline/gitops.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: argocd_app
      until: argocd_app.rc == 0
      retries: 6
      delay: 10

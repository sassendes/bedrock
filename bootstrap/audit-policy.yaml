apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: None
    nonResourceURLs:
      - /healthz*
      - /readyz*
      - /livez*
      - /version
      - /metrics
  - level: None
    verbs:
      - watch
  - level: None
    resources:
      - group: coordination.k8s.io
        resources:
          - leases
      - group: ""
        resources:
          - events
  - level: Metadata

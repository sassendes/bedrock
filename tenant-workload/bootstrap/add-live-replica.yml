---
- name: Add a live replica behind the current primary
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
    repo_root: "{{ playbook_dir }}/.."
    tpl: "{{ repo_root }}/database/replica"
    instances: 2
    storage: 10Gi
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: The replica name is a dns label
      ansible.builtin.assert:
        that:
          - replica is defined
          - replica is match('^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$')
        fail_msg: "set REPLICA to a lowercase name like cluster-4"

    - name: Ask for the replica's namespace
      ansible.builtin.command: kubectl get namespace {{ replica }} --ignore-not-found -o name
      register: existing_ns
      changed_when: false

    - name: Names are never reused
      ansible.builtin.assert:
        that: existing_ns.stdout == ""
        fail_msg: "namespace {{ replica }} already exists, pick a new name"

    - name: Find the primary from the role labels, never from a name
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/database-roles.yml"

    - name: Work out who follows whom
      ansible.builtin.set_fact:
        image: "{{ primaries[0].image }}"
        source: "{{ primaries[0].name }}"
        source_ns: "{{ primaries[0].ns }}"
        me: {name: "{{ replica }}", ns: "{{ replica }}"}
        peers: "{{ primaries + lives }}"
        followers: "{{ lives + delays }}"

    - name: A read only key on every peer's bucket for the replica
      ansible.builtin.set_fact:
        ro_keys: "{{ ro_keys | default([]) + [{'bucket': item.name, 'ns': replica}] }}"
      loop: "{{ peers }}"

    - name: A read only key on the replica's bucket for every follower
      ansible.builtin.set_fact:
        ro_keys: "{{ ro_keys + [{'bucket': replica, 'ns': item.ns}] }}"
      loop: "{{ followers }}"

    - name: Say what is about to happen
      ansible.builtin.debug:
        msg:
          - "{{ replica }} bootstraps from {{ source_ns }}/{{ source }}"
          - "it can follow: {{ peers | map(attribute='name') | join(', ') }}"
          - "these will be able to follow it: {{ followers | map(attribute='name') | join(', ') or 'none' }}"

    - name: Namespace, labelled as a database
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/namespace.yaml.j2"
      register: replica_ns
      until: replica_ns is succeeded
      retries: 5
      delay: 2

    - name: The replica's own network policies
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/netpol.yaml.j2"

    - name: Garage bucket for the replica and a read only key for every pair
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/garage.yaml.j2"

    - name: Wait for the garage job
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Job
        namespace: garage
        name: garage-init-{{ replica }}
      register: gjob
      until: >
        gjob.resources | default([]) | length > 0 and
        ((gjob.resources[0].status.succeeded | default(0)) >= 1 or
         (gjob.resources[0].status.failed | default(0)) > 3)
      retries: 40
      delay: 10

    - name: The garage job succeeded
      ansible.builtin.assert:
        that: (gjob.resources[0].status.succeeded | default(0)) >= 1
        fail_msg: "garage-init-{{ replica }} failed, read: kubectl -n garage logs job/garage-init-{{ replica }}"

    - name: Revoke the garage job's secret access
      ansible.builtin.command: kubectl -n {{ item }} delete rolebinding/garage-init-{{ replica }} role/garage-init-{{ replica }} --ignore-not-found
      loop: "{{ ro_keys | map(attribute='ns') | list | union([replica]) | unique }}"
      changed_when: true

    - name: The replica follows every peer that can become primary
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/pair.yaml.j2"
      vars:
        follower: "{{ me }}"
        peer: "{{ item }}"
      loop: "{{ peers }}"
      register: pair_in
      until: pair_in is succeeded
      retries: 10
      delay: 6

    - name: Every replica can follow the new one once it is promoted
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/pair.yaml.j2"
      vars:
        follower: "{{ item }}"
        peer: "{{ me }}"
      loop: "{{ followers }}"
      register: pair_out
      until: pair_out is succeeded
      retries: 10
      delay: 6

    - name: Wait for every peer's certificates and read only key in the replica
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: "{{ replica }}"
        name: "{{ item }}"
      register: synced
      until: synced.resources | default([]) | length > 0
      retries: 30
      delay: 10
      loop: "{{ peers | map(attribute='name') | product(['-ca-crt', '-replication', '-backups-ro']) | map('join') | list }}"

    - name: Wait for the replica's own backup key
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: "{{ replica }}"
        name: "{{ replica }}-backups"
      register: own_key
      until: own_key.resources | default([]) | length > 0
      retries: 30
      delay: 10

    - name: A fresh base backup of the source, so the replica restores from this timeline
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/seed-backup.yaml.j2"

    - name: Wait for the seed backup
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Backup
        namespace: "{{ source_ns }}"
        name: "{{ replica }}-seed"
      register: seed
      until: >
        seed.resources | default([]) | length > 0 and
        (seed.resources[0].status.phase | default('')) in ['completed', 'failed']
      retries: 60
      delay: 15

    - name: The seed backup completed
      ansible.builtin.assert:
        that: seed.resources[0].status.phase == 'completed'
        fail_msg: "seed backup failed: {{ seed.resources[0].status.error | default('no error recorded') }}"

    - name: Let the failover decider act on the replica once it is promoted
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/failover.yaml.j2"

    - name: The replica cluster, its pooler and its backups
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: "{{ tpl }}/cluster.yaml.j2"

    - name: Wait for the replica to be healthy
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: "{{ replica }}"
        name: "{{ replica }}"
      register: rc
      until: >
        rc.resources | default([]) | length > 0 and
        (rc.resources[0].status.readyInstances | default(0)) >= (instances | int) and
        (rc.resources[0].status.phase | default('')) == 'Cluster in healthy state'
      retries: 80
      delay: 15

    - name: Confirm the replica streams from the source
      ansible.builtin.shell: |
        set -euo pipefail
        p=$(kubectl get cluster {{ replica }} -n {{ replica }} -o jsonpath='{.status.currentPrimary}')
        kubectl exec -n {{ replica }} "$p" -c postgres -- psql -tA -d postgres -c "SELECT status FROM pg_stat_wal_receiver"
      args:
        executable: /bin/bash
      register: stream
      until: stream.stdout | trim == 'streaming'
      retries: 20
      delay: 10
      changed_when: false

    - name: Wait for the new replica's certificates and read only key in every follower
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: "{{ item.0.ns }}"
        name: "{{ replica }}{{ item.1 }}"
      register: out_synced
      until: out_synced.resources | default([]) | length > 0
      retries: 30
      delay: 10
      loop: "{{ followers | product(['-ca-crt', '-replication', '-backups-ro']) | list }}"

    - name: Give every follower an externalClusters entry for the new replica, so the decider can repoint it
      ansible.builtin.shell: |
        set -euo pipefail
        j=$(kubectl -n {{ item.ns }} get cluster {{ item.name }} -o json)
        if echo "$j" | jq -e '.spec.externalClusters[]? | select(.name == "{{ replica }}")' >/dev/null; then
          echo kept
          exit 0
        fi
        if ! echo "$j" | jq -e '.spec.externalClusters' >/dev/null; then
          kubectl -n {{ item.ns }} patch cluster {{ item.name }} --type json -p '[{"op":"add","path":"/spec/externalClusters","value":[]}]'
        fi
        kubectl -n {{ item.ns }} patch cluster {{ item.name }} --type json -p '[{"op":"add","path":"/spec/externalClusters/-","value":{{ entry | to_json }}}]'
        echo patched
      args:
        executable: /bin/bash
      vars:
        entry:
          name: "{{ replica }}"
          connectionParameters:
            host: "{{ replica }}-rw.{{ replica }}.svc"
            user: streaming_replica
            dbname: app
            sslmode: verify-ca
          sslKey: {name: "{{ replica }}-replication", key: tls.key}
          sslCert: {name: "{{ replica }}-replication", key: tls.crt}
          sslRootCert: {name: "{{ replica }}-ca-crt", key: ca.crt}
          barmanObjectStore:
            destinationPath: "s3://{{ replica }}-backups/wals"
            endpointURL: http://garage.garage.svc:3900
            s3Credentials:
              accessKeyId: {name: "{{ replica }}-backups-ro", key: AWS_ACCESS_KEY_ID}
              secretAccessKey: {name: "{{ replica }}-backups-ro", key: AWS_SECRET_ACCESS_KEY}
      loop: "{{ followers }}"
      register: entry_patch
      changed_when: "'patched' in entry_patch.stdout"

    - name: Wait for the replica's ca to reach the failover components
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: ConfigMap
        namespace: bedrock-failover
        name: "db-ca-{{ replica }}"
      register: fca
      until: fca.resources | default([]) | length > 0
      retries: 30
      delay: 10

    - name: Done
      ansible.builtin.debug:
        msg: "{{ replica }} is a live replica of {{ source_ns }}/{{ source }}, and {{ followers | map(attribute='name') | join(', ') or 'no other replica' }} can follow it after a failover"

---
- name: Tear down bedrock cleanly on all nodes
  hosts: rke2_servers
  become: true
  vars_prompt:
    - name: confirm_teardown
      prompt: "this wipes RKE2, etcd and every Longhorn volume on all nodes. type the word destroy to continue"
      private: false
  tasks:
    - name: Refuse to continue without explicit confirmation
      ansible.builtin.assert:
        that: confirm_teardown == "destroy"
        fail_msg: "teardown cancelled, nothing was touched"
      run_once: true

    - name: Uninstall RKE2
      ansible.builtin.command: /usr/local/bin/rke2-uninstall.sh
      args:
        removes: /usr/local/bin/rke2-uninstall.sh

    - name: Remove kubectl links and profile
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/kubectl
        - /usr/local/bin/crictl
        - /usr/local/bin/ctr
        - /etc/profile.d/rke2.sh

    - name: Wipe RKE2 state incl. etcd db
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rancher/rke2
        - /etc/rancher/rke2

    - name: Remove CIS kernel parameters file
      ansible.builtin.file:
        path: /etc/sysctl.d/60-rke2-cis.conf
        state: absent

    - name: Wipe Longhorn on-disk state
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: absent

    - name: Recreate empty Longhorn dir
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        mode: "0755"

- name: Remove the admin kubeconfig from the controller
  hosts: localhost
  become: false
  gather_facts: false
  tasks:
    - name: Delete the private kubeconfig directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.bedrock"
        state: absent

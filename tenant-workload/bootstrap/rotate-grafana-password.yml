- name: Rotate the Grafana admin password (Grafana's database first, then OpenBao and the controller copy)
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.bedrock/kubeconfig"
    bedrock_dir: "{{ lookup('env', 'HOME') }}/.bedrock"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: The OpenBao init file there is now
      ansible.builtin.stat:
        path: "{{ bedrock_dir }}/openbao-init.json"
      register: bao_init_file

    - name: Refuse without the OpenBao root token
      ansible.builtin.assert:
        that: bao_init_file.stat.exists
        fail_msg: "no {{ bedrock_dir }}/openbao-init.json, run the bootstrap first"

    - name: Make the new password
      ansible.builtin.set_fact:
        new_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Set it in Grafana's database (Grafana only reads its env password on an empty database)
      ansible.builtin.shell: |
        set -eu
        printf '%s\n' "$NEW_PASSWORD" | kubectl -n application exec -i deploy/grafana -c grafana -- sh -c 'read -r p; grafana cli admin reset-admin-password "$p" >/dev/null'
      environment:
        NEW_PASSWORD: "{{ new_password }}"
      no_log: true
      changed_when: true

    - name: Put it in OpenBao, so a Grafana with an empty database starts with it too
      ansible.builtin.shell: |
        set -eu
        printf '%s\n%s\n' "$BAO_ROOT" "$NEW_PASSWORD" | kubectl -n openbao exec -i openbao-0 -- sh -c 'read -r BAO_TOKEN; export BAO_TOKEN; read -r p; printf "%s" "$p" | bao kv put -mount=apps grafana/admin username=admin password=- >/dev/null'
      environment:
        BAO_ROOT: "{{ (lookup('file', bedrock_dir + '/openbao-init.json') | from_json).root_token }}"
        NEW_PASSWORD: "{{ new_password }}"
      no_log: true
      changed_when: true

    - name: Keep the controller copy in step
      ansible.builtin.copy:
        dest: "{{ bedrock_dir }}/grafana-admin"
        content: "{{ new_password }}"
        mode: "0600"
      no_log: true

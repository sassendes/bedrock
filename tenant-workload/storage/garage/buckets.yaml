apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-init
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-init-volume-size
  namespace: garage
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["data-garage-0"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init-volume-size
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-init-volume-size
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garage-init-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cluster-1-backups", "cluster-2-backups", "cluster-3-backups", "loki-data", "tempo-data", "cluster-1-backups-ro", "cluster-2-backups-ro"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: cluster-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-init-secrets
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: cluster-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-init-secrets
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: cluster-3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-init-secrets
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-init
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-init-secrets
subjects:
  - kind: ServiceAccount
    name: garage-init
    namespace: garage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-init
  namespace: garage
data:
  init.sh: |
    set -euo pipefail
    A="http://garage.garage.svc:3903/v2"
    api() { curl -fsS -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "Content-Type: application/json" "$@"; }
    until [ "$(api "$A/GetClusterStatus" | jq '[.nodes[] | select(.isUp)] | length')" = "3" ]; do sleep 5; done
    if [ "$(api "$A/GetClusterLayout" | jq -r '.roles | length')" = "0" ]; then
      SIZE=$(kubectl -n garage get pvc data-garage-0 -o jsonpath='{.status.capacity.storage}')
      CAP=$(echo "$SIZE" | awk '{ n = $0 + 0; u = $0; sub(/^[0-9.]+/, "", u); m["Ki"] = 2^10; m["Mi"] = 2^20; m["Gi"] = 2^30; m["Ti"] = 2^40; m["K"] = 1e3; m["M"] = 1e6; m["G"] = 1e9; m["T"] = 1e12; m[""] = 1; if (!(u in m)) exit 1; printf "%.0f", n * m[u] * 0.9 }')
      ROLES=$(api "$A/GetClusterStatus" | jq -c --argjson cap "$CAP" '[.nodes[] | {id: .id, zone: "dc1", capacity: $cap, tags: []}]')
      api -X POST "$A/UpdateClusterLayout" -d "{\"roles\":$ROLES}" >/dev/null
      V=$(api "$A/GetClusterLayout" | jq -r '.version')
      api -X POST "$A/ApplyClusterLayout" -d "{\"version\":$((V+1))}" >/dev/null
    fi
    for pair in cluster-1-backups:cluster-1 cluster-2-backups:cluster-2 cluster-3-backups:cluster-3 loki-data:application tempo-data:application; do
      B=${pair%%:*}
      NS=${pair##*:}
      if kubectl -n "$NS" get secret "$B" >/dev/null 2>&1; then continue; fi
      BID=$(api "$A/GetBucketInfo?globalAlias=$B" 2>/dev/null | jq -r '.id' || true)
      if [ -z "$BID" ] || [ "$BID" = "null" ]; then
        BID=$(api -X POST "$A/CreateBucket" -d "{\"globalAlias\":\"$B\"}" | jq -r '.id')
      fi
      KEYS=$(api "$A/ListKeys")
      for OLD in $(echo "$KEYS" | jq -r --arg n "$B" '.[] | select(.name == $n) | .id'); do
        api -X POST "$A/DeleteKey?id=$OLD" >/dev/null
      done
      K=$(api -X POST "$A/CreateKey" -d "{\"name\":\"$B\"}")
      KID=$(echo "$K" | jq -r '.accessKeyId')
      KS=$(echo "$K" | jq -r '.secretAccessKey')
      api -X POST "$A/AllowBucketKey" -d "{\"bucketId\":\"$BID\",\"accessKeyId\":\"$KID\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}" >/dev/null
      kubectl -n "$NS" create secret generic "$B" --from-literal=AWS_ACCESS_KEY_ID="$KID" --from-literal=AWS_SECRET_ACCESS_KEY="$KS"
    done
    MISSING=""
    for NS in cluster-2 cluster-3; do
      if ! kubectl -n "$NS" get secret cluster-1-backups-ro >/dev/null 2>&1; then MISSING="$MISSING $NS"; fi
    done
    if [ -n "$MISSING" ]; then
      BID=$(api "$A/GetBucketInfo?globalAlias=cluster-1-backups" | jq -r '.id')
      KEYS=$(api "$A/ListKeys")
      for OLD in $(echo "$KEYS" | jq -r '.[] | select(.name == "cluster-1-backups-ro") | .id'); do
        api -X POST "$A/DeleteKey?id=$OLD" >/dev/null
      done
      K=$(api -X POST "$A/CreateKey" -d '{"name":"cluster-1-backups-ro"}')
      KID=$(echo "$K" | jq -r '.accessKeyId')
      KS=$(echo "$K" | jq -r '.secretAccessKey')
      api -X POST "$A/AllowBucketKey" -d "{\"bucketId\":\"$BID\",\"accessKeyId\":\"$KID\",\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}" >/dev/null
      for NS in $MISSING; do
        kubectl -n "$NS" create secret generic cluster-1-backups-ro --from-literal=AWS_ACCESS_KEY_ID="$KID" --from-literal=AWS_SECRET_ACCESS_KEY="$KS"
      done
    fi
    for pair in cluster-2:cluster-3; do
      SRC=${pair%%:*}
      NS=${pair##*:}
      if kubectl -n "$NS" get secret "$SRC-backups-ro" >/dev/null 2>&1; then continue; fi
      BID=$(api "$A/GetBucketInfo?globalAlias=$SRC-backups" | jq -r '.id')
      NAME="$SRC-backups-ro-$NS"
      KEYS=$(api "$A/ListKeys")
      for OLD in $(echo "$KEYS" | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id'); do
        api -X POST "$A/DeleteKey?id=$OLD" >/dev/null
      done
      K=$(api -X POST "$A/CreateKey" -d "{\"name\":\"$NAME\"}")
      KID=$(echo "$K" | jq -r '.accessKeyId')
      KS=$(echo "$K" | jq -r '.secretAccessKey')
      api -X POST "$A/AllowBucketKey" -d "{\"bucketId\":\"$BID\",\"accessKeyId\":\"$KID\",\"permissions\":{\"read\":true,\"write\":false,\"owner\":false}}" >/dev/null
      kubectl -n "$NS" create secret generic "$SRC-backups-ro" --from-literal=AWS_ACCESS_KEY_ID="$KID" --from-literal=AWS_SECRET_ACCESS_KEY="$KS"
    done
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: garage
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: garage-init
    spec:
      serviceAccountName: garage-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: alpine/k8s:1.36.4@sha256:358ddfc2d6ff3f00dd461dbd79aaa6d6738709f225b8da0945bb63bd4dbc304e
          command: ["bash", "/script/init.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin_token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /script
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: garage-init
        - name: tmp
          emptyDir: {}

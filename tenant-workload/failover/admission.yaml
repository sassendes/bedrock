apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: bedrock-decider
  namespace: bedrock-failover
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-approvals
  namespace: bedrock-failover
  labels:
    bedrock.io/failover-role: approvals
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
  labels:
    bedrock.io/failover-role: checker
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-failover-params-stay
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bedrock-failover
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["configmaps"]
        resourceNames: ["bedrock-approvals", "bedrock-checker"]
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["leases"]
        resourceNames: ["bedrock-decider"]
  validations:
    - expression: "false"
      message: the policies below read this object; deleting it would block every write they match. Remove the policies first
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-failover-params-stay
spec:
  policyName: bedrock-failover-params-stay
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-vote-owner
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bedrock-failover
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  matchConditions:
    - name: observer
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-observer"
  variables:
    - name: node
      expression: "'authentication.kubernetes.io/node-name' in request.userInfo.extra ? request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''"
    - name: pod
      expression: "'authentication.kubernetes.io/pod-name' in request.userInfo.extra ? request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] : ''"
    - name: slot
      expression: "variables.pod.startsWith('bedrock-observer-a-') ? 'a' : (variables.pod.startsWith('bedrock-observer-b-') ? 'b' : '')"
  validations:
    - expression: request.operation != "DELETE"
      message: observers never delete
    - expression: variables.node != "" && variables.slot != "" && object.metadata.name == "vote-" + variables.node + "-" + variables.slot && object.?data.node.orValue("") == variables.node && object.?data.slot.orValue("") == variables.slot
      messageExpression: "'an observer may only write vote-' + variables.node + '-' + variables.slot"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-vote-owner
spec:
  policyName: bedrock-vote-owner
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-court-writers
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bedrock-failover
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  variables:
    - name: name
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
    - name: verifier
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-verifier"
    - name: checker
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-checker"
    - name: serviceAccount
      expression: request.userInfo.username.startsWith("system:serviceaccount:")
    - name: observer
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-observer"
    - name: decider
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-decider"
    - name: kyverno
      expression: request.userInfo.username == "system:serviceaccount:kyverno:kyverno-background-controller"
  validations:
    - expression: "!variables.name.startsWith('vote-') || variables.observer || !variables.serviceAccount"
      message: no workload but an observer writes votes
    - expression: "!variables.name.startsWith('claim-') || variables.decider || !variables.serviceAccount"
      message: no workload but the decider writes claims
    - expression: "!variables.name.startsWith('db-ca-') || variables.kyverno || !variables.serviceAccount"
      message: no workload but kyverno writes the database cas
    - expression: "!variables.kyverno || variables.name.startsWith('db-ca-')"
      message: kyverno writes nothing here but the database cas
    - expression: "!(variables.name in ['bedrock-round', 'bedrock-approvals']) || variables.verifier || !variables.serviceAccount"
      message: no workload but the verifier writes rounds and approvals
    - expression: "!variables.verifier || (variables.name in ['bedrock-round', 'bedrock-approvals'] && request.operation != 'DELETE')"
      message: the verifier writes nothing else
    - expression: "variables.name != 'bedrock-checker' || variables.checker || !variables.serviceAccount"
      message: no workload but the checker writes the checker's object
    - expression: "!variables.checker || (variables.name == 'bedrock-checker' && request.operation != 'DELETE')"
      message: the checker writes nothing else
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-court-writers
spec:
  policyName: bedrock-court-writers
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-decider-holds-lease
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: coordination.k8s.io/v1
    kind: Lease
  matchConstraints:
    namespaceSelector:
      matchLabels:
        bedrock.io/failover-scope: "true"
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusters"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["pods", "services", "configmaps"]
  matchConditions:
    - name: decider
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-decider"
  variables:
    - name: pod
      expression: "'authentication.kubernetes.io/pod-name' in request.userInfo.extra ? request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] : ''"
  validations:
    - expression: variables.pod != "" && variables.pod == params.spec.?holderIdentity.orValue("")
      messageExpression: "'only the lease holder may act, ' + variables.pod + ' does not hold it'"
    - expression: request.resource.resource != "configmaps" || (request.namespace == "bedrock-failover" && request.name.startsWith("claim-") && request.operation != "DELETE")
      message: the decider only writes claims
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-decider-holds-lease
spec:
  policyName: bedrock-decider-holds-lease
  validationActions: ["Deny"]
  paramRef:
    name: bedrock-decider
    namespace: bedrock-failover
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-decider-approved
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        bedrock.io/failover-scope: "true"
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusters"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["pods", "services"]
  matchConditions:
    - name: decider
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-decider"
  variables:
    - name: approvals
      expression: params.?data.orValue({})
    - name: epoch
      expression: "object != null ? object.metadata.?annotations[?'bedrock.io/failover-epoch'].orValue('') : ''"
    - name: slots
      expression: "variables.epoch == '' ? [] : variables.approvals.filter(k, k.endsWith('.state') && variables.approvals[k] == 'valid' && variables.approvals[?(k.substring(0, k.size() - 6) + '.epoch')].orValue('') == variables.epoch).map(k, k.substring(0, k.size() - 6))"
    - name: approvedEpoch
      expression: "size(variables.slots) > 0"
    - name: clusterKey
      expression: "request.namespace + '.' + request.name"
    - name: podTarget
      expression: "request.resource.resource == 'pods' && oldObject != null ? request.namespace + '.' + oldObject.metadata.?labels[?'cnpg.io/cluster'].orValue('') : ''"
    - name: isClusterUpdate
      expression: "request.resource.resource == 'clusters' && request.operation == 'UPDATE'"
    - name: oldReplica
      expression: "variables.isClusterUpdate ? oldObject.spec.?replica.orValue({}) : {}"
    - name: newReplica
      expression: "variables.isClusterUpdate ? object.spec.?replica.orValue({}) : {}"
    - name: oldPg
      expression: "variables.isClusterUpdate ? oldObject.spec.?postgresql.orValue({}) : {}"
    - name: newPg
      expression: "variables.isClusterUpdate ? object.spec.?postgresql.orValue({}) : {}"
    - name: oldParams
      expression: "variables.oldPg.?parameters.orValue({})"
    - name: newParams
      expression: "variables.newPg.?parameters.orValue({})"
    - name: promotes
      expression: "variables.oldReplica.?enabled.orValue(false) == true && variables.newReplica.?enabled.orValue(false) == false"
    - name: repoints
      expression: "variables.oldReplica.?source.orValue('') != variables.newReplica.?source.orValue('')"
    - name: fences
      expression: "variables.isClusterUpdate && ['cnpg.io/reconciliationLoop', 'cnpg.io/hibernation'].exists(a, object.metadata.?annotations[?a].orValue('') != oldObject.metadata.?annotations[?a].orValue(''))"
    - name: oldLabels
      expression: "variables.isClusterUpdate ? oldObject.metadata.?labels.orValue({}) : {}"
    - name: newLabels
      expression: "variables.isClusterUpdate ? object.metadata.?labels.orValue({}) : {}"
    - name: oldRole
      expression: "variables.oldLabels[?'bedrock.io/db-role'].orValue('')"
    - name: newRole
      expression: "variables.newLabels[?'bedrock.io/db-role'].orValue('')"
    - name: candidates
      expression: "variables.slots.map(s, variables.approvals[?(s + '.candidate')].orValue('')).filter(c, c != '')"
    - name: hosts
      expression: "variables.slots.map(s, variables.approvals[?(s + '.host')].orValue('')).filter(h, h != '')"
  validations:
    - expression: request.resource.resource != "clusters" || (request.operation == "UPDATE" && variables.approvedEpoch)
      message: a cluster write needs a valid approval for the epoch it carries
    - expression: request.resource.resource != "services" || (request.operation == "UPDATE" && variables.approvedEpoch)
      message: a service write needs a valid approval for the epoch it carries
    - expression: "request.resource.resource != 'clusters' || request.operation != 'UPDATE' || (oldObject.spec.all(k, k == 'replica' || k == 'postgresql' || (k in object.spec && object.spec[k] == oldObject.spec[k])) && object.spec.all(k, k == 'replica' || k == 'postgresql' || k in oldObject.spec))"
      message: during a failover the decider may change spec.replica and nothing else in a cluster
    - expression: "!variables.isClusterUpdate || (variables.oldPg.all(k, k == 'parameters' || (k in variables.newPg && variables.newPg[k] == variables.oldPg[k])) && variables.newPg.all(k, k == 'parameters' || k in variables.oldPg) && variables.oldParams.all(k, k == 'archive_mode' || (k in variables.newParams && variables.newParams[k] == variables.oldParams[k])) && variables.newParams.all(k, k == 'archive_mode' || k in variables.oldParams))"
      message: during a failover the decider may change nothing in spec.postgresql but the archive_mode cnpg sets on promotion
    - expression: "!variables.isClusterUpdate || variables.oldParams[?'archive_mode'].orValue('') == variables.newParams[?'archive_mode'].orValue('') || (variables.promotes && variables.newParams[?'archive_mode'].orValue('') == 'on')"
      message: archive_mode only changes to on, in the write that promotes
    - expression: "request.resource.resource != 'clusters' || request.operation != 'UPDATE' || variables.approvals[?(variables.clusterKey + '.state')].orValue('') != 'valid' || oldObject.status.?currentPrimary.orValue('') == variables.approvals[?(variables.clusterKey + '.instance')].orValue('')"
      message: the approval names the instance that died; fencing a cluster whose primary moved since is refused
    - expression: "!variables.isClusterUpdate || (variables.newReplica.all(k, k in ['enabled', 'source'] || (k in variables.oldReplica && variables.oldReplica[k] == variables.newReplica[k])) && variables.oldReplica.all(k, k in ['enabled', 'source'] || k in variables.newReplica))"
      message: during a failover the decider may change spec.replica.enabled and spec.replica.source and nothing else in spec.replica
    - expression: "!variables.isClusterUpdate || !(variables.oldReplica.?enabled.orValue(false) == false && variables.newReplica.?enabled.orValue(false) == true)"
      message: the decider never turns a cluster into a replica
    - expression: "!variables.isClusterUpdate || (variables.newLabels.all(k, k == 'bedrock.io/db-role' || (k in variables.oldLabels && variables.oldLabels[k] == variables.newLabels[k])) && variables.oldLabels.all(k, k == 'bedrock.io/db-role' || k in variables.newLabels))"
      message: during a failover the decider changes no label but bedrock.io/db-role
    - expression: "!variables.isClusterUpdate || variables.oldRole == variables.newRole || (variables.promotes && variables.newRole == 'primary')"
      message: bedrock.io/db-role only changes to primary, in the same write that promotes
    - expression: "!variables.promotes || variables.newRole == 'primary'"
      message: a promotion sets bedrock.io/db-role to primary in the same write
    - expression: "!variables.promotes || variables.clusterKey in variables.candidates"
      messageExpression: "'only the candidate the verifier checked may be promoted, ' + variables.clusterKey + ' is not it'"
    - expression: "!variables.fences || (variables.clusterKey in variables.slots && oldObject.status.?currentPrimary.orValue('') == variables.approvals[?(variables.clusterKey + '.instance')].orValue(''))"
      messageExpression: "'only the approved dead primary may be fenced, ' + variables.clusterKey + ' is not it'"
    - expression: "!variables.repoints || (!(variables.clusterKey in variables.slots) && !(variables.clusterKey in variables.candidates))"
      message: only a follower is repointed, never the fenced target or the promoted candidate
    - expression: "request.resource.resource != 'services' || request.operation != 'UPDATE' || (object.spec.type == 'ExternalName' && object.spec.?externalName.orValue('').endsWith('.svc.cluster.local'))"
      message: postgres-rw may only point inside the cluster
    - expression: "request.resource.resource != 'services' || request.operation != 'UPDATE' || object.spec.?externalName.orValue('') in variables.hosts"
      messageExpression: "'postgres-rw may only point at the host the verifier approved, not ' + object.spec.?externalName.orValue('')"
    - expression: request.resource.resource != "pods" || (request.operation == "DELETE" && oldObject.metadata.?labels[?'cnpg.io/podRole'].orValue('') == 'instance' && variables.approvals[?(variables.podTarget + '.state')].orValue('') == 'valid')
      message: the decider may only delete instance pods of a cluster with a valid approval
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-decider-approved
spec:
  policyName: bedrock-decider-approved
  validationActions: ["Deny"]
  paramRef:
    name: bedrock-approvals
    namespace: bedrock-failover
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-checker-halt
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    namespaceSelector:
      matchLabels:
        bedrock.io/failover-scope: "true"
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusters"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["pods", "services"]
  matchConditions:
    - name: decider
      expression: request.userInfo.username == "system:serviceaccount:bedrock-failover:bedrock-decider"
  validations:
    - expression: "!params.?data.orValue({}).exists(k, k.endsWith('.halt') && params.data[k] == 'true')"
      message: the checker saw a database up while the normal path was down, everything stops
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-checker-halt
spec:
  policyName: bedrock-checker-halt
  validationActions: ["Deny"]
  paramRef:
    name: bedrock-checker
    namespace: bedrock-failover
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bedrock-failover-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bedrock-failover
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: "variables.containers.all(c, c.image.matches('^ghcr[.]io/sassendes/bedrock-failover:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$'))"
      message: a failover pod runs only the bedrock-failover image, pinned by digest
    - expression: "variables.containers.all(c, 'memory' in c.?resources.?limits.orValue({}) && 'cpu' in c.?resources.?limits.orValue({}))"
      message: cpu and memory limits are required on every container and init container
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bedrock-failover-pods
spec:
  policyName: bedrock-failover-pods
  validationActions: ["Deny"]

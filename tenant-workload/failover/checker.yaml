apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
  labels:
    app.kubernetes.io/name: bedrock-checker
    app.kubernetes.io/part-of: bedrock-failover
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-checker
        app.kubernetes.io/part-of: bedrock-failover
    spec:
      serviceAccountName: bedrock-checker
      priorityClassName: bedrock-data
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: ghcr.io/sassendes/bedrock-failover:0.3.3@sha256:bbaa3b41e1883077fa35279739b874c7e0f81447c2485260941447de9402fc50
          command: ["/checker"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

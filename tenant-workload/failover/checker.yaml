apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: bedrock-checker
    app.kubernetes.io/part-of: bedrock-failover
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-checker
        app.kubernetes.io/part-of: bedrock-failover
    spec:
      serviceAccountName: bedrock-checker
      priorityClassName: bedrock-data
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: ghcr.io/sassendes/bedrock-failover:0.1.0@sha256:2deaf442b7e7dcd7f027a3920696e511213a8fce0391744ff44a284c9782e50a
          command: ["/checker"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/bedrock/pg-ca
              readOnly: true
      volumes:
        - name: pg-ca
          projected:
            sources:
              - secret:
                  name: cluster-1-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-1.crt
              - secret:
                  name: cluster-2-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-2.crt
              - secret:
                  name: cluster-3-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-3.crt

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: bedrock-checker
    app.kubernetes.io/part-of: bedrock-failover
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-checker
        app.kubernetes.io/part-of: bedrock-failover
    spec:
      serviceAccountName: bedrock-checker
      priorityClassName: bedrock-data
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: ghcr.io/sassendes/bedrock-failover:0.2.0@sha256:4a85955ff7de38f27a5f0c09e47392e431117c9d29ec5c915d71892073bb9bff
          command: ["/checker"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

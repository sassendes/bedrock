apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bedrock-failover
  namespace: bedrock-failover
specs:
  - description: every failover pod, kubelet probes and prometheus in, apiserver and dns out
    endpointSelector: {}
    ingress:
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: application
              app.kubernetes.io/name: prometheus
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
            rules:
              http:
                - method: GET
                  path: "/metrics"
    egress:
      - toEntities:
          - kube-apiserver
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
  - description: observers talk to each other on the exchange and to postgres
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: bedrock-observer
    ingress:
      - fromEndpoints:
          - matchLabels:
              app.kubernetes.io/name: bedrock-observer
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: bedrock-observer
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.cilium.k8s.namespace.labels.bedrock.io/database: "true"
              cnpg.io/podRole: instance
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
  - description: the verifier reads replica streams on postgres and the instance manager
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: bedrock-verifier
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.cilium.k8s.namespace.labels.bedrock.io/database: "true"
              cnpg.io/podRole: instance
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
              - port: "8000"
                protocol: TCP
  - description: the checker asks the instance manager only
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: bedrock-checker
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.cilium.k8s.namespace.labels.bedrock.io/database: "true"
              cnpg.io/podRole: instance
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bedrock-observer-pg
  namespace: bedrock-failover
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    roleName: bedrock-observer
    audience: openbao
    objects: |
      - objectName: password
        secretPath: apps/data/failover/observer
        secretKey: password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bedrock-verifier-pg
  namespace: bedrock-failover
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    roleName: bedrock-verifier
    audience: openbao
    objects: |
      - objectName: password
        secretPath: apps/data/failover/observer
        secretKey: password

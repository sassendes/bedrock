apiVersion: v1
kind: Namespace
metadata:
  name: bedrock-failover
  labels:
    bedrockctl.com/role: bedrock-failover
    bedrockctl.com/host-limited: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    bedrockctl.com/failover-scope: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: bedrock-failover
automountServiceAccountToken: false

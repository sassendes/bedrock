apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bedrock-observer-a
  namespace: bedrock-failover
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: bedrock-observer
    app.kubernetes.io/part-of: bedrock-failover
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-observer
      bedrock.io/observer-slot: "a"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-observer
        app.kubernetes.io/part-of: bedrock-failover
        bedrock.io/observer-slot: "a"
    spec:
      serviceAccountName: bedrock-observer
      priorityClassName: bedrock-data
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: observer
          image: ghcr.io/sassendes/bedrock-failover:0.3.2@sha256:0b45155c1034558031dc4c0e354ebc0e285fda9954ea9b0dd8996a9bf67bb41f
          command: ["/observer"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OBSERVER_SLOT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['bedrock.io/observer-slot']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: exchange
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pg-password
              mountPath: /etc/bedrock/pg
              readOnly: true
            - name: exchange-tls
              mountPath: /etc/bedrock/exchange
              readOnly: true
            - name: run
              mountPath: /run/bedrock
      volumes:
        - name: pg-password
          secret:
            secretName: bedrock-observer
            items:
              - key: password
                path: password
        - name: exchange-tls
          secret:
            secretName: bedrock-observer-exchange
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-observer
  namespace: bedrock-failover
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-decider
  namespace: bedrock-failover
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-verifier
  namespace: bedrock-failover
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-failover-read
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-failover-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-failover-read
subjects:
  - kind: ServiceAccount
    name: bedrock-observer
    namespace: bedrock-failover
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
  - kind: ServiceAccount
    name: bedrock-verifier
    namespace: bedrock-failover
  - kind: ServiceAccount
    name: bedrock-checker
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-failover-store
  namespace: bedrock-failover
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-failover-store
  namespace: bedrock-failover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-failover-store
subjects:
  - kind: ServiceAccount
    name: bedrock-observer
    namespace: bedrock-failover
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
  - kind: ServiceAccount
    name: bedrock-verifier
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-decider-lease
  namespace: bedrock-failover
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-decider-lease
  namespace: bedrock-failover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-decider-lease
subjects:
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bedrock-decider-act
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-decider-act
  namespace: cluster-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-decider-act
subjects:
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-decider-act
  namespace: cluster-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-decider-act
subjects:
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-decider-act
  namespace: cluster-3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bedrock-decider-act
subjects:
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-decider-flip
  namespace: application
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-decider-flip
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-decider-flip
subjects:
  - kind: ServiceAccount
    name: bedrock-decider
    namespace: bedrock-failover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bedrock-checker
  namespace: bedrock-failover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bedrock-checker
subjects:
  - kind: ServiceAccount
    name: bedrock-checker
    namespace: bedrock-failover

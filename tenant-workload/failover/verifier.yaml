apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-verifier
  namespace: bedrock-failover
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: bedrock-verifier
    app.kubernetes.io/part-of: bedrock-failover
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bedrock-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bedrock-verifier
        app.kubernetes.io/part-of: bedrock-failover
    spec:
      serviceAccountName: bedrock-verifier
      priorityClassName: bedrock-data
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: ghcr.io/sassendes/bedrock-failover:0.2.0@sha256:4a85955ff7de38f27a5f0c09e47392e431117c9d29ec5c915d71892073bb9bff
          command: ["/verifier"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: proof-keys
              mountPath: /etc/bedrock/proof-keys
              readOnly: true
            - name: pg-password
              mountPath: /etc/bedrock/pg
              readOnly: true
            - name: pg-ca
              mountPath: /etc/bedrock/pg-ca
              readOnly: true
            - name: run
              mountPath: /run/bedrock
      volumes:
        - name: proof-keys
          secret:
            secretName: bedrock-proof-keys
            defaultMode: 0400
        - name: pg-password
          secret:
            secretName: bedrock-observer
            items:
              - key: password
                path: password
        - name: pg-ca
          projected:
            sources:
              - secret:
                  name: cluster-1-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-1.crt
              - secret:
                  name: cluster-2-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-2.crt
              - secret:
                  name: cluster-3-ca-crt
                  items:
                    - key: ca.crt
                      path: cluster-3.crt
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

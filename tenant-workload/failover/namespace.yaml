apiVersion: v1
kind: Namespace
metadata:
  name: bedrock-failover
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    bedrock.io/failover-scope: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: bedrock-failover
automountServiceAccountToken: false

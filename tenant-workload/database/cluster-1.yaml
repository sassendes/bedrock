apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-1
  namespace: cluster-1
spec:
  postgresql:
    parameters:
      log_statement: "ddl"
    pg_hba:
      - hostnossl all all all reject
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  monitoring:
    enablePodMonitor: true
  instances: 2
  priorityClassName: bedrock-data
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4@sha256:3c0ba08ea353c9705a755c113e4ae395be76553e0ed68076e5410cb09b9d17d9
  storage:
    size: 10Gi
    storageClass: longhorn-encrypted
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
      slotPrefix: _cnpg_
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1"
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
    - name: AWS_DEFAULT_REGION
      value: garage
  bootstrap:
    initdb:
      database: app
      owner: appuser
      secret:
        name: user-secret-1
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - CREATE TABLE IF NOT EXISTS bedrock_heartbeat (observer text PRIMARY KEY, nonce text NOT NULL, at timestamptz NOT NULL);
        - CREATE ROLE bedrock_observer LOGIN;
        - REVOKE ALL ON bedrock_heartbeat FROM PUBLIC;
        - GRANT SELECT (observer, nonce), INSERT (observer, nonce, at), UPDATE (nonce, at) ON bedrock_heartbeat TO bedrock_observer;
        - GRANT EXECUTE ON FUNCTION pg_control_system() TO bedrock_observer;
        - GRANT EXECUTE ON FUNCTION pg_control_checkpoint() TO bedrock_observer;
  managed:
    roles:
      - name: bedrock_observer
        login: true
        ensure: present
        passwordSecret:
          name: bedrock-observer
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  backup:
    barmanObjectStore:
      destinationPath: s3://cluster-1-backups/wals
      endpointURL: http://garage.garage.svc:3900
      s3Credentials:
        accessKeyId:
          name: cluster-1-backups
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cluster-1-backups
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"

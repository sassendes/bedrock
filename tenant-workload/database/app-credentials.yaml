apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-app
  namespace: application
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bedrock-app-db
  namespace: application
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    roleName: bedrock-app
    audience: openbao
    objects: |
      - objectName: username
        secretPath: database/static-creds/bedrock-app
        secretKey: username
      - objectName: password
        secretPath: database/static-creds/bedrock-app
        secretKey: password

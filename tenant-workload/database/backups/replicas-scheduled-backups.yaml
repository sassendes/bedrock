apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cluster-2-scheduled-backup
  namespace: cluster-2
spec:
  schedule: "0 0 */6 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: cluster-2
  method: barmanObjectStore

apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-csi-provider
  namespace: secrets-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-csi-provider
  namespace: secrets-store
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-csi-provider-hmac-key"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-csi-provider
  namespace: secrets-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-csi-provider
subjects:
  - kind: ServiceAccount
    name: openbao-csi-provider
    namespace: secrets-store
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openbao-csi-provider
  namespace: secrets-store
  labels:
    app.kubernetes.io/name: openbao-csi-provider
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-csi-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-csi-provider
    spec:
      serviceAccountName: openbao-csi-provider
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      initContainers:
        - name: prepare-provider-dir
          image: quay.io/openbao/openbao-csi-provider:2.0.3@sha256:ad30d5f6223f30f62e8df6e444b84af5b05402a70c09712415dd1d7f139c027e
          command: ["/bin/sh", "-ec"]
          args: ["chown 1000:1000 /provider"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: providervol
              mountPath: /provider
      containers:
        - name: provider-openbao
          image: quay.io/openbao/openbao-csi-provider:2.0.3@sha256:ad30d5f6223f30f62e8df6e444b84af5b05402a70c09712415dd1d7f139c027e
          args:
            - -endpoint=/provider/openbao.sock
            - -debug=false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
          volumeMounts:
            - name: providervol
              mountPath: /provider
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 2
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: providervol
          hostPath:
            path: /etc/kubernetes/secrets-store-csi-providers
            type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/os: linux

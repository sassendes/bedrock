apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: secrets-store
  namespace: secrets-store
specs:
  - description: every pod in secrets-store, deny by default
    endpointSelector: {}
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
  - description: the csi driver, liveness from the node and the api server for pods and secret provider classes
    endpointSelector:
      matchLabels:
        app: csi-secrets-store
    ingress:
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "9808"
                protocol: TCP
    egress:
      - toEntities:
          - kube-apiserver
  - description: the openbao provider, probes from the node, the api server for its hmac key and openbao
    endpointSelector:
      matchLabels:
        app.kubernetes.io/name: openbao-csi-provider
    ingress:
      - fromEntities:
          - host
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toEntities:
          - kube-apiserver
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: openbao
              app: openbao
        toPorts:
          - ports:
              - port: "8200"
                protocol: TCP

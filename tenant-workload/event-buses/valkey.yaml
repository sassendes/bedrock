apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey
  namespace: valkey
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: valkey-auth
  namespace: valkey
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    roleName: valkey
    audience: openbao
    objects: |
      - objectName: password
        secretPath: apps/data/valkey/auth
        secretKey: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-init
  namespace: valkey
data:
  init.sh: |
    set -eu
    PASS=$(cat /run/secrets/openbao/password)
    export VALKEYCLI_AUTH="$PASS"
    DOMAIN="valkey-headless.valkey.svc.cluster.local"
    SELF="${POD_NAME}.${DOMAIN}"
    SAVED="/data/sentinel.conf"
    MASTER=""
    CURRENT_EPOCH=0
    CONFIG_EPOCH=0

    for i in 0 1 2; do
      PEER="valkey-${i}.${DOMAIN}"
      if [ "$PEER" = "$SELF" ]; then continue; fi
      FOUND=$(timeout 3 valkey-cli -h "$PEER" -p 26379 sentinel get-master-addr-by-name bedrock 2>/dev/null | head -n 1 || true)
      if [ -n "$FOUND" ]; then MASTER="$FOUND"; break; fi
    done

    if [ -f "$SAVED" ]; then
      if [ -z "$MASTER" ]; then
        MASTER=$(awk '$1=="sentinel" && $2=="monitor" {print $4; exit}' "$SAVED")
      fi
      CURRENT_EPOCH=$(awk '$1=="sentinel" && $2=="current-epoch" {print $3; exit}' "$SAVED")
      CONFIG_EPOCH=$(awk '$1=="sentinel" && $2=="config-epoch" {print $4; exit}' "$SAVED")
      CURRENT_EPOCH=${CURRENT_EPOCH:-0}
      CONFIG_EPOCH=${CONFIG_EPOCH:-0}
    fi

    if [ -z "$MASTER" ]; then MASTER="valkey-0.${DOMAIN}"; fi

    cat > /etc/valkey/valkey.conf <<CONF
    port 6379
    bind 0.0.0.0
    protected-mode no
    dir /data
    appendonly yes
    appendfsync everysec
    maxmemory 768mb
    maxmemory-policy volatile-lru
    requirepass ${PASS}
    primaryauth ${PASS}
    replica-announce-ip ${SELF}
    min-replicas-to-write 1
    min-replicas-max-lag 10
    CONF
    if [ "$MASTER" != "$SELF" ]; then
      echo "replicaof ${MASTER} 6379" >> /etc/valkey/valkey.conf
    fi

    cat > "$SAVED" <<CONF
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip ${SELF}
    requirepass ${PASS}
    sentinel sentinel-pass ${PASS}
    sentinel current-epoch ${CURRENT_EPOCH}
    sentinel monitor bedrock ${MASTER} 6379 2
    sentinel config-epoch bedrock ${CONFIG_EPOCH}
    sentinel auth-pass bedrock ${PASS}
    sentinel down-after-milliseconds bedrock 5000
    sentinel failover-timeout bedrock 60000
    sentinel parallel-syncs bedrock 1
    CONF
  cli.sh: |
    VALKEYCLI_AUTH=$(cat /run/secrets/openbao/password)
    export VALKEYCLI_AUTH
    exec valkey-cli "$@"
  prestop.sh: |
    VALKEYCLI_AUTH=$(cat /run/secrets/openbao/password)
    export VALKEYCLI_AUTH
    ROLE=$(valkey-cli info replication | tr -d '\r' | awk -F: '$1=="role" {print $2}')
    if [ "$ROLE" != "master" ]; then exit 0; fi
    DOMAIN="valkey-headless.valkey.svc.cluster.local"
    SELF="${POD_NAME}.${DOMAIN}"
    for i in 0 1 2; do
      PEER="valkey-${i}.${DOMAIN}"
      if [ "$PEER" = "$SELF" ]; then continue; fi
      if timeout 3 valkey-cli -h "$PEER" -p 26379 sentinel failover bedrock 2>/dev/null | grep -q OK; then break; fi
    done
    for i in $(seq 1 20); do
      ROLE=$(valkey-cli info replication | tr -d '\r' | awk -F: '$1=="role" {print $2}')
      if [ "$ROLE" != "master" ]; then exit 0; fi
      sleep 1
    done
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: valkey
  labels:
    app: valkey
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
    - name: sentinel
      port: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: valkey
  labels:
    app: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: sentinel
      port: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: valkey
  labels:
    app: valkey
spec:
  serviceName: valkey-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      serviceAccountName: valkey
      priorityClassName: bedrock-workload
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: valkey
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: config
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          command: ["sh", "/init/init.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: init
              mountPath: /init
            - name: conf
              mountPath: /etc/valkey
            - name: data
              mountPath: /data
            - name: openbao-secrets
              mountPath: /run/secrets/openbao
              readOnly: true
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "/init/prestop.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: valkey
              containerPort: 6379
          startupProbe:
            exec:
              command: ["sh", "/init/cli.sh", "ping"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "/init/cli.sh", "ping"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "/init/cli.sh", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: init
              mountPath: /init
            - name: conf
              mountPath: /etc/valkey
            - name: data
              mountPath: /data
            - name: openbao-secrets
              mountPath: /run/secrets/openbao
              readOnly: true
        - name: sentinel
          image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          command: ["valkey-sentinel", "/data/sentinel.conf"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "25"]
          ports:
            - name: sentinel
              containerPort: 26379
          livenessProbe:
            exec:
              command: ["sh", "/init/cli.sh", "-p", "26379", "ping"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "/init/cli.sh", "-p", "26379", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: init
              mountPath: /init
            - name: data
              mountPath: /data
            - name: openbao-secrets
              mountPath: /run/secrets/openbao
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: valkey-init
        - name: conf
          emptyDir: {}
        - name: openbao-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: valkey-auth
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-encrypted
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: valkey
  namespace: valkey
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: valkey

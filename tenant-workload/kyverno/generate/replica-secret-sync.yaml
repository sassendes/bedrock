apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:bedrock-secrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:bedrock-secrets
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-replica-ca-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - cluster-1
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        resourceNames: [cluster-1-ca]
  variables:
    - name: caCrt
      expression: |-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": "cluster-1-ca-crt"
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "ca.crt": object.data["ca.crt"]
            })
          }
        ]
  generate:
    - expression: generator.Apply("cluster-2", variables.caCrt)
    - expression: generator.Apply("cluster-3", variables.caCrt)
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-replica-secret-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
        resourceNames: [cluster-2, cluster-3]
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: source
      expression: resource.Get("v1", "secrets", "cluster-1", "cluster-1-replication")
  generate:
    - expression: generator.Apply(variables.nsName, [variables.source])

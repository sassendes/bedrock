apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-failover-ca-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - cluster-1
            - cluster-2
            - cluster-3
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        resourceNames: [cluster-1-ca, cluster-2-ca, cluster-3-ca]
  matchConditions:
    - name: own-ca-only
      expression: object.metadata.name == object.metadata.namespace + "-ca"
  variables:
    - name: caCrt
      expression: |-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": object.metadata.name + "-crt"
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "ca.crt": object.data["ca.crt"]
            })
          }
        ]
  generate:
    - expression: generator.Apply("bedrock-failover", variables.caCrt)
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-failover-password-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - cluster-1
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        resourceNames: [bedrock-observer]
  variables:
    - name: password
      expression: |-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": "bedrock-observer"
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "password": object.data["password"]
            })
          }
        ]
  generate:
    - expression: generator.Apply("bedrock-failover", variables.password)

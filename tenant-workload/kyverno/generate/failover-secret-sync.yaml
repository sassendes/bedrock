apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:bedrock-db-cas
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-background-controller-db-cas
  namespace: bedrock-failover
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-background-controller-db-cas
  namespace: bedrock-failover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-background-controller-db-cas
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:bedrock-db-cas
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-failover-ca-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        bedrock.io/database: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: own-ca-only
      expression: object.metadata.name == object.metadata.namespace + "-ca"
  variables:
    - name: caMap
      expression: |-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("ConfigMap"),
            "metadata": dyn({
              "name": dyn("db-ca-" + object.metadata.namespace),
              "labels": dyn({"bedrock.io/db-ca": "true"})
            }),
            "data": dyn({
              "ca.crt": string(base64.decode(object.data["ca.crt"]))
            })
          }
        ]
  generate:
    - expression: generator.Apply("bedrock-failover", variables.caMap)
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: bedrock-failover-password-sync
spec:
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - cluster-1
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        resourceNames: [bedrock-observer]
  variables:
    - name: password
      expression: |-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": "bedrock-observer"
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "password": object.data["password"]
            })
          }
        ]
  generate:
    - expression: generator.Apply("bedrock-failover", variables.password)

apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: bedrock-http
  namespace: observability
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: http
      static:
        - http://grafana.observability.svc:3000/api/health
        - http://loki.observability.svc:3100/ready
        - http://alertmanager-operated.observability.svc:9093/-/healthy
        - http://prometheus-operated.observability.svc:9090/-/healthy
        - http://garage.garage.svc:3903/health
        - http://tempo.observability.svc:3200/ready
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: bedrock-tls
  namespace: observability
spec:
  interval: 5m
  module: tls_connect
  prober:
    url: blackbox-exporter.observability.svc:9115
  targets:
    staticConfig:
      labels:
        probe_group: tls
      static:
        - kubernetes.default.svc:443
        - kyverno-svc.kyverno.svc:443
        - cnpg-webhook-service.cnpg-system.svc:443

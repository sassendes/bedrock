apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ceph-osd
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  staleReplicaTimeout: "2880"
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.4
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
  dashboard:
    enabled: false
  monitoring:
    enabled: true
  crashCollector:
    disable: true
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
  storage:
    useAllNodes: false
    useAllDevices: false
    onlyApplyOSDPlacement: false
    storageClassDeviceSets:
      - name: osd
        count: 3
        # pinned to the node it was born on so ceph's "host" = a real node.
        # pools replicate across hosts so each copy sits on a different machine.
        portable: false
        encrypted: false
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rook-ceph-osd
        preparePlacement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - rook-ceph-osd-prepare
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              resources:
                requests:
                  storage: 20Gi
              storageClassName: longhorn-ceph-osd
              volumeMode: Block
              accessModes:
                - ReadWriteOnce
  resources:
    mon:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    osd:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 3Gi
    prepareosd:
      requests:
        cpu: 100m
        memory: 128Mi
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  disruptionManagement:
    managePodBudgets: true
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 60s
      status:
        interval: 60s

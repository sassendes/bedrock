apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-system
  namespace: cnpg-system
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - {}
  - fromEntities:
    - host
  - fromEntities:
    - kube-apiserver
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '9443'
        protocol: TCP
  egress:
  - toEndpoints:
    - {}
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP

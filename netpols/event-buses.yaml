apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nats
  namespace: nats
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - {}
  - fromEntities:
    - host
  egress:
  - toEndpoints:
    - {}
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
---

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage
  namespace: garage
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: application
            app: loki
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: application
            app: tempo
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: application
            app: blackbox-exporter
      toPorts:
        - ports:
            - port: "3903"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cluster-1
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cluster-2
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cluster-3
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY

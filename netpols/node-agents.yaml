apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-agents
  namespace: node-agents
spec:
  endpointSelector: {}
  ingress:
  - fromEntities:
    - host
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: application
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '12345'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  egress:
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: application
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: application
        app: tempo
    toPorts:
    - ports:
      - port: '4317'
        protocol: TCP

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-agents
  namespace: node-agents
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - {}
  - fromEntities:
    - host
  egress:
  - toEndpoints:
    - {}
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: application
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      - port: '4317'
        protocol: TCP

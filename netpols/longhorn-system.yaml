apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-system
  namespace: longhorn-system
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - {}
  - fromEntities:
    - host
    - remote-node
    - kube-apiserver
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: application
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9500'
        protocol: TCP
  egress:
  - toEndpoints:
    - {}
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEntities:
    - host
    - remote-node

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: application
  namespace: application
specs:
- description: every pod in application, deny by default
  endpointSelector: {}
  ingress:
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
      - port: '3200'
        protocol: TCP
      - port: '9003'
        protocol: TCP
      - port: '9090'
        protocol: TCP
      - port: '9093'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
- description: prometheus
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: grafana
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
      rules:
        http:
        - method: GET|POST
          path: '/api/v1/(query|query_range|query_exemplars)(\?.*)?'
        - method: GET|POST
          path: '/api/v1/(series|labels|metadata)(\?.*)?'
        - method: GET|POST
          path: '/api/v1/label/[^/?]+/values(\?.*)?'
        - method: GET|POST
          path: '/api/v1/search/[a-z_]+(\?.*)?'
        - method: GET
          path: '/api/v1/(rules|alerts|status/buildinfo)(\?.*)?'
  - fromEndpoints:
    - matchLabels:
        app: opencost
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
      rules:
        http:
        - method: GET|POST
          path: '/api/v1/(query|query_range)(\?.*)?'
        - method: GET
          path: '/api/v1/status/(buildinfo|config)(\?.*)?'
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/-/healthy'
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  egress:
  - &id001
    toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        app: kube-state-metrics
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: opencost
    toPorts:
    - ports:
      - port: '9003'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '9115'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: falco
        app: falco
    toPorts:
    - ports:
      - port: '8765'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
        cnpg.io/podRole: instance
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
        cnpg.io/podRole: instance
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
        cnpg.io/podRole: instance
    toPorts:
    - ports:
      - port: '9187'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
        cnpg.io/podRole: pooler
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
        cnpg.io/podRole: pooler
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
        cnpg.io/podRole: pooler
    toPorts:
    - ports:
      - port: '9127'
        protocol: TCP
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '10250'
        protocol: TCP
      - port: '9100'
        protocol: TCP
      - port: '2381'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: tempo
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kyverno
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: longhorn-system
        app: longhorn-manager
    toPorts:
    - ports:
      - port: '9500'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: garage
        app: garage
    toPorts:
    - ports:
      - port: '3903'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        app.kubernetes.io/name: cloudnative-pg
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: node-agents
        app: alloy
    toPorts:
    - ports:
      - port: '12345'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
- description: alertmanager
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
      rules:
        http:
        - method: POST
          path: '/api/v2/alerts'
        - method: GET
          path: '/metrics'
  - fromEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
      rules:
        http:
        - method: POST
          path: '/api/v2/alerts'
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/-/healthy'
- description: grafana
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/api/health'
  egress:
  - *id001
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: tempo
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
- description: loki
  endpointSelector:
    matchLabels:
      app: loki
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      - port: '9095'
        protocol: TCP
      - port: '7946'
        protocol: TCP
      - port: '7946'
        protocol: UDP
  - fromEndpoints:
    - matchLabels:
        app: grafana
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      rules:
        http:
        - method: GET|POST
          path: '/loki/api/v1/(query|query_range|series|labels)(\?.*)?'
        - method: GET|POST
          path: '/loki/api/v1/label/[^/?]+/values(\?.*)?'
        - method: GET|POST
          path: '/loki/api/v1/(index/stats|detected_fields)(\?.*)?'
        - method: GET|POST
          path: '/loki/api/v1/detected_field/[^/?]+/values(\?.*)?'
        - method: GET
          path: '/loki/api/v1/tail(\?.*)?'
        - method: GET
          path: '/prometheus/api/v1/(rules|alerts)(\?.*)?'
        - method: GET
          path: '/api/prom/rules(/[^?]*)?(\?.*)?'
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: node-agents
        app: alloy
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      rules:
        http:
        - method: POST
          path: '/loki/api/v1/push'
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/ready'
  egress:
  - toEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
      - port: '9095'
        protocol: TCP
      - port: '7946'
        protocol: TCP
      - port: '7946'
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: garage
    toPorts:
    - ports:
      - port: '3900'
        protocol: TCP
- description: tempo
  endpointSelector:
    matchLabels:
      app: tempo
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: grafana
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/api/(search|echo|v2/search/tags)(\?.*)?'
        - method: GET
          path: '/api/v2/search/tag/[^/?]+/values(\?.*)?'
        - method: GET
          path: '/api/(v2/)?traces/[^/?]+(\?.*)?'
        - method: GET
          path: '/api/metrics/(query_range|query)(\?.*)?'
        - method: POST
          path: '/tempopb\.StreamingQuerier/[A-Za-z0-9]+'
  - fromEndpoints:
    - matchLabels:
        app: blackbox-exporter
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/ready'
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: node-agents
        app: alloy
    toPorts:
    - ports:
      - port: '4317'
        protocol: TCP
      rules:
        http:
        - method: POST
          path: '/opentelemetry\.proto\.collector\.trace\.v1\.TraceService/Export'
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: garage
    toPorts:
    - ports:
      - port: '3900'
        protocol: TCP
- description: opencost
  endpointSelector:
    matchLabels:
      app: opencost
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9003'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  egress:
  - *id001
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
- description: kube-state-metrics
  endpointSelector:
    matchLabels:
      app: kube-state-metrics
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/metrics'
  egress:
  - *id001
- description: blackbox-exporter
  endpointSelector:
    matchLabels:
      app: blackbox-exporter
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9115'
        protocol: TCP
      rules:
        http:
        - method: GET
          path: '/probe\?.*'
  egress:
  - toEndpoints:
    - matchLabels:
        app: grafana
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: tempo
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: garage
    toPorts:
    - ports:
      - port: '3903'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
        cnpg.io/podRole: instance
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
        cnpg.io/podRole: instance
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
        cnpg.io/podRole: instance
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
        cnpg.io/podRole: pooler
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
        cnpg.io/podRole: pooler
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
        cnpg.io/podRole: pooler
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kyverno
        app.kubernetes.io/component: admission-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        app.kubernetes.io/name: cloudnative-pg
    toPorts:
    - ports:
      - port: '9443'
        protocol: TCP

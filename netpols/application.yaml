- description: blackbox-exporter
  endpointSelector:
    matchLabels:
      app: blackbox-exporter
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9115'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        app: grafana
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: alertmanager
    toPorts:
    - ports:
      - port: '9093'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: tempo
    toPorts:
    - ports:
      - port: '3200'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: garage
    toPorts:
    - ports:
      - port: '3903'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-1
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-2
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cluster-3
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kyverno
        app.kubernetes.io/component: admission-controller
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
        app.kubernetes.io/name: cloudnative-pg

<aside class="toc">
  <div class="toc-links">
    {{ with .File }}
    <a href="{{ site.Params.repo }}/edit/main/docs/content/{{ .Path }}">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Edit this page</a>
    {{ end }}
    <a href="{{ site.Params.repo }}/issues/new?title={{ .Title | urlquery }}">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v5.5M12 16v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Create an issue</a>
  </div>
  {{ if and (not .IsHome) (gt (len .TableOfContents) 40) }}
  <div class="toc-body">
    <div class="toc-title">On this page</div>
    {{ .TableOfContents }}
  </div>
  {{ end }}
</aside>

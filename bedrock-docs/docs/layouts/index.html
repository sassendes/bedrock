{{ define "main" }}
<article class="prose home-prose">
  <p class="lead">{{ site.Params.description }}</p>
  {{ .Content }}
</article>
<div class="cards">
  {{ range .Params.cards }}
  <section class="card">
    <h2>{{ .title }}</h2>
    <p>{{ .text }}</p>
    <ul>
      {{ range .links }}<li><a href="{{ .url | relURL }}">{{ .name }}</a></li>{{ end }}
    </ul>
    <a class="button" href="{{ .button.url | relURL }}">{{ .button.name }}</a>
  </section>
  {{ end }}
</div>
{{ end }}

name: failover image

on:
  push:
    branches: [main]
    paths:
      - failover-controller/**
      - Makefile
      - .github/workflows/failover-image.yml
      - tenant-workload/kyverno/admission/registry-allowlist.yaml
  pull_request:
    paths:
      - failover-controller/**
      - .github/workflows/failover-image.yml
      - tenant-workload/kyverno/admission/registry-allowlist.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      BEDROCK_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: failover-controller/go.mod
          cache-dependency-path: failover-controller/go.sum
      - name: the three registry allowlists carry the same pattern
        run: make check-allowlist
      - name: vet
        working-directory: failover-controller
        run: go vet ./...
      - name: api server and etcd for the admission tests
        working-directory: failover-controller
        run: |
          set -eu
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
          echo "BEDROCK_APISERVER_BIN=$("$(go env GOPATH)/bin/setup-envtest" use 1.36.2 --bin-dir "$RUNNER_TEMP/envtest" -p path)" >> "$GITHUB_ENV"
      - name: postgres for the heartbeat tests
        run: |
          set -eu
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          test -x "$bin/initdb"
          echo "BEDROCK_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: test
        working-directory: failover-controller
        run: go test ./...

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: build and push a tag that does not exist yet
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          image=$(make -s print-failover-image)
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published. A tag is never rebuilt: bump FAILOVER_IMAGE in the Makefile to publish a change."
            exit 0
          fi
          docker build -t "$image" failover-controller
          docker push "$image"

name: failover image

on:
  push:
    branches: [main]
    paths:
      - failover-controller/**
      - Makefile
      - .github/workflows/failover-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          image=$(make -s print-failover-image)
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$image" failover-controller
          docker push "$image"

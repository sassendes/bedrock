{{ define "main" }}
<article class="prose">
  {{ with .Params.lead }}<p class="lead">{{ . | markdownify }}</p>{{ end }}
  {{ .Content }}
  <div class="section-list">
    {{ range .Pages.ByWeight }}
      <a class="section-item" href="{{ .RelPermalink }}">
        <span class="section-item-title">{{ .Title }}</span>
        {{ with .Description }}<span class="section-item-desc">{{ . }}</span>{{ end }}
      </a>
    {{ end }}
  </div>
</article>
{{ end }}

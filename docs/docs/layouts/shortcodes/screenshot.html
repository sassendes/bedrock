{{ $file := .Get 0 }}
{{ $alt := .Get 1 }}
{{ $path := printf "static/images/screenshots/%s" $file }}
<figure class="screenshot">
  {{ if fileExists $path }}
    <img src="{{ printf "images/screenshots/%s" $file | relURL }}" alt="{{ $alt }}" loading="lazy">
  {{ else }}
    <div class="screenshot-missing"><span>Screenshot</span><code>static/images/screenshots/{{ $file }}</code></div>
  {{ end }}
  <figcaption>{{ $alt }}</figcaption>
</figure>

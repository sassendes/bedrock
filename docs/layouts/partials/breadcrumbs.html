{{ $root := site.GetPage "/docs" }}
{{ if ne . $root }}
<nav class="crumbs" aria-label="Breadcrumb">
  <a href="{{ $root.RelPermalink }}">Documentation</a>
  {{ range .Ancestors.Reverse }}{{ if and (not .IsHome) (ne . $root) }}<span>/</span><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ end }}
  <span>/</span><span class="here">{{ .LinkTitle }}</span>
</nav>
{{ end }}

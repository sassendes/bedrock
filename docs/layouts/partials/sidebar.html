<aside class="sidebar" id="sidebar">
  <nav class="tree" aria-label="Documentation">
    {{ $cur := . }}
    {{ $root := site.GetPage "/docs" }}
    <a class="tree-root{{ if eq $cur $root }} current{{ end }}" href="{{ $root.RelPermalink }}">Documentation</a>
    <ul>
      {{ range $root.Sections.ByWeight }}
        {{ $open := or (eq $cur .) ($cur.IsDescendant .) }}
        <li class="branch{{ if $open }} open{{ end }}">
          <button class="caret" type="button" aria-label="Expand {{ .Title }}" aria-expanded="{{ if $open }}true{{ else }}false{{ end }}"></button>
          <a href="{{ .RelPermalink }}"{{ if eq $cur . }} class="current"{{ end }}>{{ .Title }}</a>
          <ul>
            {{ range .Pages.ByWeight }}
              <li><a href="{{ .RelPermalink }}"{{ if eq $cur . }} class="current"{{ end }}>{{ .LinkTitle }}</a></li>
            {{ end }}
          </ul>
        </li>
      {{ end }}
    </ul>
  </nav>
</aside>

<svg viewBox="0 0 960 424" role="img" aria-labelledby="sl-title sl-desc"><title id="sl-title">Security layers</title><desc id="sl-desc">From the outside in, the layers an attacker has to get past before reaching tenant data.</desc><defs><marker id="sl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="d-arrow"/></marker><marker id="sl-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="d-arrow-a"/></marker></defs><rect x="24" y="24" width="912" height="376" class="d-sq"/><rect x="42" y="72" width="876" height="312" class="d-sq2"/><rect x="60" y="120" width="840" height="248" class="d-sq"/><rect x="78" y="168" width="804" height="184" class="d-sq2"/><text x="38" y="44" class="d-lab">01 · supply chain</text><text x="38" y="62" class="d-mono">sha256 on every bundle · every image pinned by digest · publisher allowlist</text><text x="56" y="92" class="d-lab">02 · admission</text><text x="56" y="110" class="d-mono">pod security restricted · kyverno · a validatingadmissionpolicy guards priority classes</text><text x="74" y="140" class="d-lab">03 · network</text><text x="74" y="158" class="d-mono">default deny · both sides pinned · no exposed ports · wireguard between nodes</text><text x="92" y="188" class="d-lab">04 · identity and runtime</text><text x="92" y="206" class="d-mono">no wildcard rbac · no default tokens · read-only backup keys · falco on every node</text><rect x="96" y="216" width="768" height="120" class="d-inv"/><rect x="108" y="229" width="149" height="17" class="d-itb"/><text x="114" y="241" class="d-itag">05 · what they want</text><text x="108" y="266" class="d-iname">tenant data</text><text x="108" y="285" class="d-imono">secrets encrypted in etcd</text><text x="108" y="302" class="d-imono">garage volumes encrypted with luks · tls-only database access</text><text x="936" y="418" class="d-mono" text-anchor="end">every ring has to fail before the one inside it matters</text></svg>

<svg viewBox="0 0 960 330" role="img" aria-label="The steps of one failover run and what each step waits for">
<defs>
<marker id="fr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="d-arrow"/></marker>
<marker id="fr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="d-arrow-w"/></marker>
</defs>
<rect x="20" y="40" width="120" height="64" rx="6" class="d-accent"/>
<text x="34" y="66" class="d-title">claimed</text><text x="34" y="86" class="d-sub">claim written</text>
<rect x="156" y="40" width="120" height="64" rx="6" class="d-box"/>
<text x="170" y="66" class="d-title">fencing</text><text x="170" y="86" class="d-sub">hibernate, delete</text>
<rect x="292" y="40" width="120" height="64" rx="6" class="d-box"/>
<text x="306" y="66" class="d-title">fenced</text><text x="306" y="86" class="d-sub">no pod left</text>
<rect x="428" y="40" width="120" height="64" rx="6" class="d-box"/>
<text x="442" y="66" class="d-title">promoting</text><text x="442" y="86" class="d-sub">replica off</text>
<rect x="564" y="40" width="120" height="64" rx="6" class="d-box"/>
<text x="578" y="66" class="d-title">promoted</text><text x="578" y="86" class="d-sub">healthy or 5 min</text>
<rect x="700" y="40" width="120" height="64" rx="6" class="d-box"/>
<text x="714" y="66" class="d-title">repointed</text><text x="714" y="86" class="d-sub">followers moved</text>
<rect x="836" y="40" width="104" height="64" rx="6" class="d-box"/>
<text x="848" y="66" class="d-title">flipped</text><text x="848" y="86" class="d-sub">postgres-rw</text>
<path d="M140 72 H154" class="d-wire" marker-end="url(#fr-n)"/>
<path d="M276 72 H290" class="d-wire" marker-end="url(#fr-n)"/>
<path d="M412 72 H426" class="d-wire" marker-end="url(#fr-n)"/>
<path d="M548 72 H562" class="d-wire" marker-end="url(#fr-n)"/>
<path d="M684 72 H698" class="d-wire" marker-end="url(#fr-n)"/>
<path d="M820 72 H834" class="d-wire" marker-end="url(#fr-n)"/>
<rect x="20" y="150" width="392" height="160" rx="6" class="d-soft"/>
<text x="36" y="176" class="d-title">before the fence, the run stops if</text>
<text x="36" y="202" class="d-sub">a fresh signed up arrives from any observer</text>
<text x="36" y="224" class="d-sub">the verifier revokes the approval</text>
<text x="36" y="246" class="d-sub">the checker halts</text>
<text x="36" y="268" class="d-sub">cnpg moved the primary to another instance</text>
<text x="36" y="290" class="d-sub">no fence verified within 1 min: halt and page</text>
<rect x="436" y="150" width="504" height="160" rx="6" class="d-soft"/>
<text x="452" y="176" class="d-title">the verifier approves only when</text>
<text x="452" y="202" class="d-sub">a majority of nodes votes down and 3 of 4 witnesses say dead</text>
<text x="452" y="224" class="d-sub">the dead instance is the one the claim names</text>
<text x="452" y="246" class="d-sub">cnpg had its minute, if the cluster has a Ready standby</text>
<text x="452" y="268" class="d-sub">the candidate caught up, or 30 s passed (loss paged)</text>
<text x="452" y="290" class="d-sub">nothing is signed up and the checker holds nothing</text>
<path d="M60 106 V148" class="d-wire" stroke-dasharray="5 4" marker-end="url(#fr-w)"/>
<path d="M148 120 H688 V148" class="d-wire" stroke-dasharray="5 4" marker-end="url(#fr-n)"/>
<text x="160" y="136" class="d-sub">claimed to fencing needs a valid approval</text>
</svg>

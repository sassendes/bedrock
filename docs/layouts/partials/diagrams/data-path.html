-3</text><text x="784" y="369" class="d-mono">5 min behind</text><rect x="196" y="440" width="352" height="32" class="d-sq"/><text x="208" y="460.5" class="d-chipt">bucket cluster-1</text><text x="536" y="460.0" class="d-mono" text-anchor="end">wal + base / 6 h</text><rect x="604" y="440" width="152" height="32" class="d-sq2"/><text x="616" y="460.5" class="d-chipt">cluster-2</text><rect x="772" y="440" width="148" height="32" class="d-sq2"/><text x="784" y="460.5" class="d-chipt">cluster-3</text><text x="24" y="196" class="d-li">postgres-rw never changes.</text><text x="24" y="218" class="d-li">failover repoints it at the</text><text x="24" y="240" class="d-li">new primary’s pooler.</text><text x="24" y="300" class="d-li">every bucket keeps 30 days.</text><text x="24" y="322" class="d-li">replicas read cluster-1’s</text><text x="24" y="344" class="d-li">bucket with a read-only key.</text></svg>

{{ define "main" }}
<section class="e404 dark-band">
  <div class="e404-inner">
    <p class="e404-code">404</p>
    <h1>Nothing is built at this address</h1>
    <p>The link is old or mistyped. Search for what you came for or start from one of these.</p>
    <button class="search-open" type="button" data-search-open>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Search the docs</span><kbd data-kbd>Ctrl K</kbd>
    </button>
    <div class="l-actions">
      <a class="btn btn-solid" href="{{ "docs/" | relURL }}">Go to the docs</a>
      <a class="btn btn-line" href="{{ "/" | relURL }}">Go to the home page</a>
    </div>
  </div>
</section>
{{ end }}
